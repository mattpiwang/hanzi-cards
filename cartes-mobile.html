<style>
/* Cartes français / chinois — feuille de style unique, aucune dépendance. */

:root {
  --bg: #0e1114;
  --panel: #161b21;
  --panel-2: #1c222a;
  --line: #262e38;
  --txt: #e9eef4;
  --dim: #8b98a6;
  --accent: #d8b26a;      /* doré, comme le portfolio photo */
  --ok: #3ecf8e;
  --warn: #f0b429;

  /* Couleurs des tons : convention classique (1 rouge, 2 orange, 3 vert, 4 bleu) */
  --t1: #ff6b6b;
  --t2: #ffb057;
  --t3: #4ecb71;
  --t4: #5aa9ff;
  --t0: #9aa7b4;

  --radius: 18px;
  /* Pile de polices chinoises : KaiTi (calligraphique) si présent, sinon YaHei */
  --cjk: "KaiTi", "STKaiti", "Kaiti SC", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font: 16px/1.6 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.wrap { width: min(1120px, 100% - 2.5rem); margin-inline: auto; }

kbd {
  font: 600 .72em/1 ui-monospace, Consolas, monospace;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: .18em .4em;
  color: var(--dim);
}

/* ---------- en-tête ---------- */

.top { border-bottom: 1px solid var(--line); padding: 1.1rem 0; }

.top-inner {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  align-items: center;
  justify-content: space-between;
}

.brand { display: flex; align-items: center; gap: .85rem; }

.logo {
  font-family: var(--cjk);
  font-size: 2rem;
  line-height: 1;
  color: var(--accent);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: .3rem .55rem;
  background: var(--panel);
}

.brand h1 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; }
.sub { margin: .1rem 0 0; color: var(--dim); font-size: .82rem; }

.stats { flex: 1 1 240px; max-width: 340px; }

.bar {
  height: 6px;
  background: var(--panel-2);
  border-radius: 999px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--ok));
  transition: width .35s ease;
}

.counters { margin: .45rem 0 0; color: var(--dim); font-size: .8rem; font-variant-numeric: tabular-nums; }

/* ---------- filtres ---------- */

.filters { display: flex; flex-wrap: wrap; gap: .45rem; padding: 1.1rem 0 .4rem; }

.chip {
  appearance: none;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--dim);
  padding: .38rem .85rem;
  border-radius: 999px;
  font: inherit;
  font-size: .82rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background-color .2s;
}

.chip:hover { color: var(--txt); border-color: #38424e; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #14181d; font-weight: 600; }
.chip .n { opacity: .6; margin-left: .35rem; font-variant-numeric: tabular-nums; }

/* ---------- la carte, avec retournement 3D ---------- */

.stage {
  perspective: 1800px;
  margin: 1.6rem auto 1.2rem;
  width: min(680px, 100%);
}

.card {
  position: relative;
  width: 100%;
  height: clamp(430px, 64vh, 620px);
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.45, .05, .25, 1);
  cursor: pointer;
  outline: none;
}

.card.flipped { transform: rotateY(180deg); }
.card:focus-visible .face { border-color: var(--accent); }

.face {
  position: absolute;
  inset: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  padding: 1.6rem 1.7rem;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Recto : le caractère seul, très grand, sur un fond légèrement lumineux */
.front {
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  background:
    radial-gradient(circle at 50% 42%, rgba(216, 178, 106, .10), transparent 62%),
    var(--panel);
}

.glyph {
  font-family: var(--cjk);
  font-size: clamp(6rem, 21vw, 11rem);
  line-height: 1;
  letter-spacing: .04em;
  color: #f4f7fa;
  text-shadow: 0 6px 30px rgba(0, 0, 0, .5);
}

.hint { margin: 0; color: var(--dim); font-size: .78rem; }

/* Verso : défile si le contenu dépasse (étymologies longues) */
.back {
  transform: rotateY(180deg);
  background: var(--panel);
  overflow-y: auto;
  gap: .2rem;
  cursor: default;
}

.back-head { text-align: center; padding-bottom: .9rem; }

.pinyin {
  font-size: clamp(1.9rem, 5vw, 2.5rem);
  font-weight: 600;
  letter-spacing: .01em;
  line-height: 1.15;
}

.tone-1 { color: var(--t1); }
.tone-2 { color: var(--t2); }
.tone-3 { color: var(--t3); }
.tone-4 { color: var(--t4); }
.tone-0 { color: var(--t0); }

.meaning { color: var(--txt); font-size: 1.02rem; margin-top: .15rem; }

/* Marqueur « en » : le sens vient de la base anglaise, pas d'une traduction */
.meaning .en {
  color: var(--dim);
  font-size: .72em;
  text-transform: uppercase;
  letter-spacing: .08em;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: .05rem .3rem;
  vertical-align: middle;
}

.back section { border-top: 1px solid var(--line); padding-top: .75rem; margin-top: .75rem; }

.back h3 {
  margin: 0 0 .5rem;
  font-size: .68rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}

/* Radicaux : chaque composant dans une pastille */
.comps { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; }

.comps li {
  display: flex;
  align-items: center;
  gap: .55rem;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: .4rem .7rem;
}

.comps .r { font-family: var(--cjk); font-size: 1.5rem; line-height: 1; }
.comps .g { font-size: .85rem; }
.comps .role {
  font-size: .62rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--dim);
  border-left: 1px solid var(--line);
  padding-left: .5rem;
}

/* Exemples de mots */
.words { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }

.words li {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: .1rem .8rem;
  align-items: baseline;
  padding: .3rem 0;
}

.words .w { font-family: var(--cjk); font-size: 1.35rem; line-height: 1.2; }
.words .p { font-size: .92rem; font-weight: 600; }
.words .t { grid-column: 2; color: var(--dim); font-size: .85rem; }

/* Étymologie */
.etype {
  display: inline-block;
  font-size: .72rem;
  letter-spacing: .04em;
  color: #14181d;
  background: var(--accent);
  border-radius: 999px;
  padding: .16rem .6rem;
  margin: 0 0 .5rem;
  font-weight: 600;
}

.etext { margin: 0; font-size: .92rem; color: #cdd6e0; }

.note {
  margin: .9rem 0 0;
  padding: .6rem .8rem;
  background: var(--panel-2);
  border: 1px dashed var(--line);
  border-radius: 10px;
  font-size: .85rem;
  color: var(--dim);
}

/* ---------- commandes ---------- */

.controls, .verdicts { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
.controls { margin-bottom: .7rem; }

.btn {
  appearance: none;
  font: inherit;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--txt);
  border-radius: 10px;
  padding: .6rem 1.1rem;
  cursor: pointer;
  transition: background-color .2s, border-color .2s, transform .1s;
}

.btn:hover { border-color: #38424e; background: var(--panel-2); }
.btn:active { transform: translateY(1px); }
.btn kbd { margin-left: .45rem; }

.btn.primary { background: var(--accent); border-color: var(--accent); color: #14181d; font-weight: 600; }
.btn.ghost { min-width: 52px; font-size: 1.1rem; }
.btn.ok { border-color: rgba(62, 207, 142, .45); }
.btn.ok:hover { background: rgba(62, 207, 142, .12); }
.btn.warn { border-color: rgba(240, 180, 41, .45); }
.btn.warn:hover { background: rgba(240, 180, 41, .12); }

.tools { text-align: center; margin: 1.1rem 0 0; color: var(--dim); font-size: .82rem; }

.link {
  appearance: none;
  background: none;
  border: 0;
  color: var(--dim);
  font: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  padding: .2rem .3rem;
}

.link:hover { color: var(--txt); }

/* ---------- pied ---------- */

.foot {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem 1.5rem;
  justify-content: space-between;
  padding: 1.6rem 0 3rem;
  color: var(--dim);
  font-size: .8rem;
}

.pos { font-variant-numeric: tabular-nums; }

/* ---------- accessibilité et petits écrans ---------- */

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  * { animation: none !important; }
}

@media (max-width: 560px) {
  .wrap { width: min(1120px, 100% - 1.4rem); }
  .face { padding: 1.1rem 1.15rem; }
  .card { height: clamp(440px, 72vh, 640px); }
  .words li { grid-template-columns: 1fr; }
  .words .t { grid-column: 1; }
}

<script>
/* Cartes français / chinois — logique de révision, sans aucune dépendance.
   Style volontairement simple (var, fonctions nommées) pour rester lisible. */

(function () {
  'use strict';

  var STORE_KEY = 'hanzi-cards-v1';

  /* Le ton n'est pas stocké dans les données : on le déduit du diacritique du
     pinyin. Une seule table suffit, et elle sert aussi à colorer les exemples. */
  var TONES = {
    'ā': 1, 'ē': 1, 'ī': 1, 'ō': 1, 'ū': 1, 'ǖ': 1,
    'á': 2, 'é': 2, 'í': 2, 'ó': 2, 'ú': 2, 'ǘ': 2,
    'ǎ': 3, 'ě': 3, 'ǐ': 3, 'ǒ': 3, 'ǔ': 3, 'ǚ': 3,
    'à': 4, 'è': 4, 'ì': 4, 'ò': 4, 'ù': 4, 'ǜ': 4
  };

  /* Seuil de maîtrise : au-delà de 2, la carte sort du paquet « à revoir ».
     Compteur simple à trois états — 0 jamais vue, 1 à revoir, 2 en cours, 3 sue. */
  var MASTERED = 3;

  var state = {
    cards: [],
    view: [],          // cartes visibles après filtrage
    i: 0,              // index dans view
    flipped: false,
    filter: 'all',
    progress: {}       // { "好": { box: 3, seen: 4, at: "2026-10-11" } }
  };

  var el = {
    deckName: document.getElementById('deck-name'),
    filters: document.getElementById('filters'),
    card: document.getElementById('card'),
    front: document.getElementById('front-glyph'),
    back: document.getElementById('back'),
    counters: document.getElementById('counters'),
    bar: document.getElementById('bar-fill'),
    position: document.getElementById('position')
  };

  /* ------------------------------------------------------------------ */
  /*  Utilitaires                                                        */
  /* ------------------------------------------------------------------ */

  function toneOf(pinyin) {
    for (var i = 0; i < pinyin.length; i++) {
      if (TONES[pinyin[i]]) { return TONES[pinyin[i]]; }
    }
    return 0; // ton neutre
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function boxOf(card) {
    var p = state.progress[card.char];
    return p ? p.box : 0;
  }

  function setBox(card, box) {
    var old = state.progress[card.char] || { seen: 0 };
    state.progress[card.char] = {
      box: box,
      seen: old.seen + 1,
      at: new Date().toISOString().slice(0, 10)
    };
    save();
  }

  /* La progression est enregistrée dans le navigateur. Deux cas où ça échoue :
     navigation privée, et fichier ouvert en file:// (Chrome l'interdit). Dans ce
     cas on continue simplement en mémoire : l'app reste utilisable, la
     progression est perdue à la fermeture. */
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state.progress)); }
    catch (e) { /* on ignore : mode privé ou file:// */ }
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) { state.progress = JSON.parse(raw) || {}; }
    } catch (e) { state.progress = {}; }
  }

  function masteredCount() {
    return state.cards.filter(function (c) { return boxOf(c) >= MASTERED; }).length;
  }

  function toReviewCount() {
    return state.cards.filter(function (c) { return boxOf(c) < MASTERED; }).length;
  }

  /* ------------------------------------------------------------------ */
  /*  Filtres                                                            */
  /* ------------------------------------------------------------------ */

  function buildFilters() {
    var cats = [];
    state.cards.forEach(function (c) {
      if (cats.indexOf(c.category) === -1) { cats.push(c.category); }
    });

    var html = chip('all', 'Toutes', state.cards.length, state.filter === 'all');
    cats.forEach(function (cat) {
      var n = state.cards.filter(function (c) { return c.category === cat; }).length;
      html += chip(cat, cat, n, state.filter === cat);
    });
    html += chip('review', 'À revoir', toReviewCount(), state.filter === 'review');
    el.filters.innerHTML = html;
  }

  function chip(key, label, count, active) {
    return '<button class="chip" data-key="' + esc(key) + '" aria-pressed="' +
      (active ? 'true' : 'false') + '">' + esc(label) +
      '<span class="n">' + count + '</span></button>';
  }

  function applyFilter(key) {
    state.filter = key;
    state.i = 0;
    if (key === 'all') {
      state.view = state.cards.slice();
    } else if (key === 'review') {
      state.view = state.cards.filter(function (c) { return boxOf(c) < MASTERED; });
    } else {
      state.view = state.cards.filter(function (c) { return c.category === key; });
    }
    buildFilters();
    render();
  }

  /* ------------------------------------------------------------------ */
  /*  Rendu                                                              */
  /* ------------------------------------------------------------------ */

  function current() {
    return state.view[state.i];
  }

  /* Le verso concentre tout ce qui est demandé : pinyin, radicaux, exemples de
     mots, étymologie. */
  function backHTML(c) {
    /* Chaque section n'apparaît que si la donnée existe : les fiches
       importées n'ont pas d'exemples de mots, et certaines n'ont pas de
       radicaux exploitables dans la source. */
    var compsHTML = (c.components && c.components.length)
      ? '<section><h3>Radicaux</h3><ul class="comps">' +
          c.components.map(function (t) {
            return '<li><span class="r">' + esc(t[0]) + '</span>' +
                   '<span class="g">' + esc(t[1]) + '</span>' +
                   '<span class="role">' + esc(t[2]) + '</span></li>';
          }).join('') +
        '</ul></section>'
      : '';

    var wordsHTML = (c.words && c.words.length)
      ? '<section><h3>Exemples</h3><ul class="words">' +
          c.words.map(function (t) {
            return '<li><span class="w">' + esc(t[0]) + '</span>' +
                   '<span class="p tone-' + toneOf(t[1]) + '">' + esc(t[1]) + '</span>' +
                   '<span class="t">' + esc(t[2]) + '</span></li>';
          }).join('') +
        '</ul></section>'
      : '';

    /* Le sens vient du français quand il existe, sinon de la base anglaise
       (avec une petite mention « en » pour que ce soit clair). */
    var sens = c.meaning
      ? esc(c.meaning)
      : (c.meaningEn ? esc(c.meaningEn) + ' <span class="en">en</span>' : '—');

    var etymoHTML = (c.etymology && c.etymology.length)
      ? '<section><h3>Étymologie</h3>' +
          '<p class="etype">' + esc(c.etymology[0]) + '</p>' +
          (c.etymology[1] ? '<p class="etext">' + esc(c.etymology[1]) + '</p>' : '') +
        '</section>'
      : '';

    return '' +
      '<div class="back-head">' +
        '<div class="pinyin tone-' + toneOf(c.pinyin) + '">' + esc(c.pinyin) + '</div>' +
        '<div class="meaning">' + sens + '</div>' +
      '</div>' +
      compsHTML + wordsHTML + etymoHTML +
      (c.note ? '<p class="note">' + esc(c.note) + '</p>' : '');
  }

  function render() {
    var c = current();

    if (!c) {
      el.front.textContent = '—';
      el.back.innerHTML = '<p class="meaning">Aucune carte dans ce filtre.</p>';
      el.position.textContent = '';
      updateStats();
      return;
    }

    el.front.textContent = c.char;
    el.back.innerHTML = backHTML(c);
    el.back.scrollTop = 0;

    // On repart toujours du recto quand on change de carte.
    state.flipped = false;
    el.card.classList.remove('flipped');

    el.position.textContent = 'Carte ' + (state.i + 1) + ' / ' + state.view.length + ' · ' + c.category;
    updateStats();
  }

  function updateStats() {
    var total = state.cards.length;
    var known = masteredCount();
    el.counters.textContent = state.view.length + ' carte' + (state.view.length > 1 ? 's' : '') +
      ' · ' + toReviewCount() + ' à revoir · ' + known + ' sue' + (known > 1 ? 's' : '');
    el.bar.style.width = total ? Math.round(known / total * 100) + '%' : '0%';
  }

  /* ------------------------------------------------------------------ */
  /*  Actions                                                            */
  /* ------------------------------------------------------------------ */

  function flip() {
    if (!current()) { return; }
    state.flipped = !state.flipped;
    el.card.classList.toggle('flipped', state.flipped);
  }

  function go(delta) {
    if (!state.view.length) { return; }
    // Navigation circulaire : après la dernière, on revient à la première.
    state.i = (state.i + delta + state.view.length) % state.view.length;
    render();
  }

  function mark(known) {
    var c = current();
    if (!c) { return; }
    // « Je sais » monte d'un cran (max 3), « À revoir » renvoie au début.
    setBox(c, known ? Math.min(boxOf(c) + 1, MASTERED) : 1);

    // Dans le filtre « à revoir », une carte maîtrisée quitte la liste :
    // on la retire pour ne pas la revoir tout de suite.
    if (state.filter === 'review' && boxOf(c) >= MASTERED) {
      state.view.splice(state.i, 1);
      if (state.i >= state.view.length) { state.i = 0; }
      buildFilters();
      render();
      return;
    }

    buildFilters();
    updateStats();
    go(1);
  }

  function shuffle() {
    for (var i = state.view.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = state.view[i]; state.view[i] = state.view[j]; state.view[j] = tmp;
    }
    state.i = 0;
    render();
  }

  function resetProgress() {
    if (!confirm('Effacer toute la progression (cartes sues et à revoir) ?')) { return; }
    state.progress = {};
    save();
    applyFilter('all');
  }

  /* ------------------------------------------------------------------ */
  /*  Écouteurs                                                          */
  /* ------------------------------------------------------------------ */

  el.filters.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (b) { applyFilter(b.dataset.key); }
  });

  el.card.addEventListener('click', flip);
  el.card.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); flip(); }
  });

  document.getElementById('flip').addEventListener('click', flip);
  document.getElementById('prev').addEventListener('click', function () { go(-1); });
  document.getElementById('next').addEventListener('click', function () { go(1); });
  document.getElementById('known').addEventListener('click', function () { mark(true); });
  document.getElementById('again').addEventListener('click', function () { mark(false); });
  document.getElementById('shuffle').addEventListener('click', shuffle);
  document.getElementById('reset').addEventListener('click', resetProgress);

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') { return; }
    switch (e.key) {
      case ' ': case 'Enter': e.preventDefault(); flip(); break;
      case 'ArrowLeft': go(-1); break;
      case 'ArrowRight': go(1); break;
      case '1': mark(false); break;
      case '2': mark(true); break;
    }
  });

  /* ------------------------------------------------------------------ */
  /*  Démarrage                                                          */
  /* ------------------------------------------------------------------ */

  function start(data) {
    state.cards = data.cards || [];
    state.view = state.cards.slice();
    el.deckName.textContent = (data.deck || 'Jeu de cartes') + ' — ' + state.cards.length + ' caractères';
    buildFilters();
    render();
  }

  function fail(err) {
    el.deckName.textContent = 'Erreur';
    el.back.innerHTML = '<p class="meaning">Impossible de charger les cartes : ' + esc(err.message) +
      '<br><br>Lance le site via un serveur local (serve.cmd ou Ctrl+Shift+B dans VS Code) : ' +
      'un fichier ouvert en file:// ne peut pas lire le JSON voisin.</p>';
  }

  load();

  /* Deux modes de chargement :
     - fichier unique (cartes-mobile.html) : les données sont déjà dans la page,
       via window.__CARDS__ — aucun réseau nécessaire, ça marche hors ligne ;
     - site normal : on va chercher data/cards.json. */
  if (window.__CARDS__) {
    start(window.__CARDS__);
  } else {
    fetch('data/cards.json', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('fichier de cartes introuvable (' + r.status + ')'); }
        return r.json();
      })
      .then(start)
      .catch(fail);
  }

  /* Installation sur le téléphone : le service worker met le site en cache pour
     qu'il fonctionne hors ligne. Il n'est disponible que sur une origine
     sécurisée (https, ou localhost) — sur http:// vers l'IP du réseau local le
     navigateur le refuse, et `serviceWorker` est simplement absent. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () { /* silencieux */ });
    });
  }

})();

</script>
</body>
</html>
