<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes 汉字 — hors ligne</title>
<meta name="description" content="Cartes de révision français / chinois : caractère au recto, pinyin, radicaux, exemples et étymologie au verso.">
<style>
/* Cartes français / chinois — feuille de style unique, aucune dépendance. */

:root {
  --bg: #0e1114;
  --panel: #161b21;
  --panel-2: #1c222a;
  --line: #262e38;
  --txt: #e9eef4;
  --dim: #8b98a6;
  --accent: #d8b26a;      /* doré, comme le portfolio photo */
  --ok: #3ecf8e;
  --warn: #f0b429;

  /* Couleurs des tons : convention classique (1 rouge, 2 orange, 3 vert, 4 bleu) */
  --t1: #ff6b6b;
  --t2: #ffb057;
  --t3: #4ecb71;
  --t4: #5aa9ff;
  --t0: #9aa7b4;

  --radius: 18px;
  /* Pile de polices chinoises : KaiTi (calligraphique) si présent, sinon YaHei */
  --cjk: "KaiTi", "Kaiti SC", "STKaiti", "SimSun", "Noto Serif SC", "Songti SC",
         "Microsoft YaHei", "Noto Sans SC", "PingFang SC", serif;
  /* Dit au navigateur quel theme on utilise : ascenseurs et controles natifs suivent. */
  color-scheme: dark;
}

/* Le calcul des dimensions, pour TOUS les thèmes.
   Cette règle était enfermée dans le bloc [data-theme="clair"] : le thème sombre
   restait donc en content-box, où width: 100% s'AJOUTE au padding au lieu de
   l'inclure. D'où une barre plus large que la fenêtre en sombre, des hauteurs
   qui comptaient la bordure en plus, et des icônes de tailles différentes.
   Elle est maintenant globale — c'est la même géométrie dans les deux thèmes. */
*, *::before, *::after { box-sizing: border-box; }

/* Mode clair : « papier de riz ». Les fibres sont dessinées en CSS — deux
   dégradés répétés très pâles — donc aucune image à charger. */
[data-theme="clair"] {
  color-scheme: light;
  --bg: #f3ecda;        /* le papier de riz */
  --panel: #fbf7ec;     /* la feuille posée dessus */
  --panel-2: #ece3ce;
  --line: #dbd0b6;
  --txt: #2a251c;       /* encre de Chine */
  --dim: #6b6250;       /* assombri : 5,1:1 sur le papier (AA) */
  --accent: #8a6415;    /* or assombri : lisible sur le papier */
  --ok: #1d8f5b;
  --warn: #b0731a;

  /* Les tons sont foncés : les teintes vives du mode sombre baveraient ici. */
  --t1: #b8342a;
  --t2: #9a5209;
  --t3: #1a7541;
  --t4: #2a5f9e;
  --t0: #6d7480;
}

[data-theme="clair"] /* Réserve la place de l'ascenseur : la page ne se décale plus quand il apparaît. */
/* La page est faite pour tenir dans l'écran (la carte prend la place restante).
   On masque donc l'ascenseur du document — la molette et le doigt continuent de
   faire défiler s'il y a vraiment trop peu de place. Deux raisons :
     - c'est lui qui faisait perdre 18 px de large à la barre d'un thème à
       l'autre, quand la page devenait défilable ;
     - un ascenseur visible sur une page qui tient dans l'écran n'apporte rien.
   Les feuilles, elles, gardent le leur : elles peuvent vraiment déborder. */

/* La page est faite pour tenir dans l'écran : la carte prend la place restante,
   la barre ne se comprime jamais, les feuilles défilent toutes seules.
   On empêche donc le document de défiler — et c'est aussi la seule façon d'avoir
   des dimensions IDENTIQUES dans les deux thèmes : la largeur d'un ascenseur
   dépend du jeu de couleurs (color-scheme: dark donne un ascenseur en
   surimpression, large de 0 px, alors que light en donne un classique de ~19 px).
   Tout ce qui réservait sa place produisait donc deux résultats différents.
   Sans ascenseur du tout, la question ne se pose plus.

   Filet de sécurité : sur une fenêtre vraiment basse, on rend le défilement. */
html, body { height: 100%; overflow: hidden; }

/* La page Thèmes défile : elle n'a pas d'écran de carte à protéger, et son
   contenu dépasse la hauteur de l'écran. On lui rend donc le défilement dans
   le corps — la hauteur reste bornée à 100 %, ce qui fait apparaître
   l'ascenseur DANS le corps, et la barre fixée en bas ne bouge pas. */
body.page-themes { overflow-y: auto; }

@media (max-height: 430px) {
  html, body { height: auto; overflow: auto; }
}

body {
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(115deg, rgba(150, 125, 80, .05) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(25deg,  rgba(150, 125, 80, .035) 0 1px, transparent 1px 11px);
}

/* Trois détails qui ne passent pas par des variables */
[data-theme="clair"] .glyph { color: #211d16; text-shadow: 0 6px 24px rgba(80, 60, 20, .12); }
[data-theme="clair"] .etext { color: #4a4235; }
/* Réserve la place de l'ascenseur : la page ne se décale plus quand il apparaît. */
body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font: 16px/1.6 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  /* dvh suit les barres d'outils mobiles qui vont et viennent ; vh reste en
     repli pour les navigateurs qui ne connaissent pas dvh. */
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* La page tient dans l'ecran : la carte prend toute la hauteur qui reste, le
   pied se contente du bas. Rien a faire defiler, et la carte est aussi grande
   que l'ecran le permet. */
main.wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

.wrap { width: min(1120px, 100% - 2.5rem); margin-inline: auto; }

kbd {
  font: 600 .72em/1 ui-monospace, Consolas, monospace;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: .18em .4em;
  color: var(--dim);
}

.bar {
  height: 6px;
  background: var(--panel-2);
  border-radius: 999px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--ok));
  transition: width .35s ease;
}

.counters { margin: .45rem 0 0; color: var(--dim); font-size: .8rem; font-variant-numeric: tabular-nums; }

/* ---------- interrupteur 阴 / 阳 ---------- */

.switch {
  appearance: none;
  display: flex;
  align-items: center;
  gap: .5rem;
  width: 100%;
  padding: .55rem .7rem;
  background: none;
  border: 0;
  border-radius: 8px;
  color: var(--txt);
  font: inherit;
  font-size: .9rem;
  text-align: left;
  cursor: pointer;
}
.switch:hover { background: var(--panel-2); }

/* Le caractère du mode actif passe en doré */
.sw-yin, .sw-yang {
  font-family: var(--cjk);
  font-size: 1.08rem;
  line-height: 1;
  color: var(--dim);
  transition: color .2s;
}
.switch[aria-checked="false"] .sw-yin { color: var(--accent); }
.switch[aria-checked="true"] .sw-yang { color: var(--accent); }

.sw-track {
  position: relative;
  width: 38px;
  height: 20px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  transition: background-color .2s, border-color .2s;
}

.sw-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--dim);
  transition: transform .2s, background-color .2s;
}

.switch[aria-checked="true"] .sw-track { background: rgba(216, 178, 106, .28); border-color: var(--accent); }
.switch[aria-checked="true"] .sw-knob { transform: translateX(18px); background: var(--accent); }

/* Largeur minimale : « Mode sombre » et « Mode clair » n'ont pas la même
   largeur, et sans ça le contenu se décale à chaque bascule. */
.sw-label { margin-left: .35rem; color: var(--dim); font-size: .78rem; }

/* ---------- page « Thèmes » ---------- */

.page-head { padding: 1.4rem 0 .4rem; }
.page-head h1 { margin: 0; font-size: 1.25rem; }
.page-head p { margin: .3rem 0 0; color: var(--dim); font-size: .87rem; }

.bloc { margin-top: 1.7rem; }

.bloc-titre {
  margin: 0 0 .6rem;
  font-size: .68rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}

.resume { margin: 0 0 .8rem; font-size: .93rem; }
.resume strong { color: var(--accent); font-variant-numeric: tabular-nums; }

/* Le détail par niveau, sous la ligne principale : une ligne discrète */
.par-niveau {
  display: block;
  margin-top: .35rem;
  color: var(--dim);
  font-size: .8rem;
  font-variant-numeric: tabular-nums;
}

/* Prévision des sept prochains jours */
.prevision { display: grid; gap: .4rem; }

.jour { display: flex; align-items: center; gap: .6rem; font-size: .82rem; color: var(--dim); }
.jour .j-nom { width: 6.5rem; }
.jour .j-n { width: 2.2rem; text-align: right; font-variant-numeric: tabular-nums; }
.jour .t-bar { flex: 1; }

.recherche {
  width: 100%;
  padding: .6rem .8rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: var(--txt);
  font: inherit;
  font-size: .9rem;
}
.recherche::placeholder { color: var(--dim); }
.recherche:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

.themes { display: grid; gap: .55rem; margin: 1.1rem 0 2.5rem; }
.bloc .themes { margin: .8rem 0 0; }

.theme-row {
  display: flex;
  align-items: center;
  gap: .9rem;
  padding: .85rem 1rem;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--txt);
  text-decoration: none;
  transition: border-color .2s, background-color .2s;
}
.theme-row:hover { border-color: var(--accent); background: var(--panel-2); }

.theme-row .t-main { flex: 1; }
.theme-row .t-name { display: block; font-weight: 600; }
.theme-row .t-count { display: block; margin-top: .15rem; color: var(--dim); font-size: .82rem; }
.theme-row .t-bar { width: 74px; height: 5px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.theme-row .t-bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); }

/* Résultat de recherche : le caractère, puis pinyin et sens */
.theme-row .t-glyphe {
  font-family: var(--cjk);
  font-size: 1.9rem;
  line-height: 1;
  min-width: 2.4rem;
  text-align: center;
}
.theme-row .t-ok {
  color: var(--ok);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .06em;
}

.back-link { display: inline-block; color: var(--dim); font-size: .9rem; text-decoration: none; }
.back-link:hover { color: var(--txt); }

/* ---------- la carte, avec retournement 3D ---------- */

.stage {
  perspective: 1800px;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  margin: .6rem auto .7rem;
  width: min(680px, 100%);
}

.stage .swipe { flex: 1 1 auto; min-height: 0; }

/* La hauteur n'est plus fixee : elle vient de la place laissee par le pied. */
.card {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 240px;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.45, .05, .25, 1);
  cursor: pointer;
  outline: none;
}

.card.flipped { transform: rotateY(180deg); }
.card:focus-visible .face { border-color: var(--accent); }

.face {
  position: absolute;
  inset: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  padding: 1.2rem;                                     /* repli : moteurs sans clamp() */
  padding: clamp(.8rem, 2.5vw, 1.6rem) clamp(.9rem, 3vw, 1.7rem);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Recto : le caractère seul, très grand, sur un fond légèrement lumineux */
.front {
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  background:
    radial-gradient(circle at 50% 42%, rgba(216, 178, 106, .10), transparent 62%),
    var(--panel);
}

.glyph {
  font-family: var(--cjk);
  /* La hauteur compte autant que la largeur : sur un ecran court, le caractere
     ne doit pas deborder de la carte. */
  font-size: 7rem;                                     /* repli : moteurs sans clamp() ni min() */
  font-size: clamp(5rem, min(21vw, 34vh), 11rem);
  line-height: 1;
  letter-spacing: .04em;
  color: #f4f7fa;
  text-shadow: 0 6px 30px rgba(0, 0, 0, .5);
}

/* L'invite de la carte (« Clic ou Espace pour retourner ») est masquée sur
   demande. Ses autres propriétés sont conservées : il suffit de retirer le
   display:none pour la faire revenir. */
.hint { display: none; margin: 0; color: var(--dim); font-size: .78rem; }

/* Verso : défile si le contenu dépasse (étymologies longues) */
.back {
  transform: rotateY(180deg);
  background: var(--panel);
  overflow-y: auto;
  /* Colonne flex : la section de l'ordre des traits est poussée au fond de la
     carte par son margin-top: auto (voir .traits-bloc). */
  display: flex;
  flex-direction: column;
  gap: .2rem;
  cursor: default;
}

.back-head { text-align: center; padding-bottom: .9rem; }

.pinyin {
  font-size: clamp(1.9rem, 5vw, 2.5rem);
  font-weight: 600;
  letter-spacing: .01em;
  line-height: 1.15;
}

.tone-1 { color: var(--t1); }
.tone-2 { color: var(--t2); }
.tone-3 { color: var(--t3); }
.tone-4 { color: var(--t4); }
.tone-0 { color: var(--t0); }

.meaning { color: var(--txt); font-size: 1.02rem; margin-top: .15rem; }

/* Sens pas encore traduit : discret, et jamais en anglais */
.meaning .manquant {
  color: var(--dim);
  font-size: .82em;
  font-style: italic;
}

.back section { border-top: 1px solid var(--line); padding-top: .75rem; margin-top: .75rem; }

.back h3 {
  margin: 0 0 .5rem;
  font-size: .68rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}

/* Radicaux : chaque composant dans une pastille */
.comps { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; }

.comps li {
  display: flex;
  align-items: center;
  gap: .55rem;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: .4rem .7rem;
}

.comps .r { font-family: var(--cjk); font-size: 1.5rem; line-height: 1; }
.comps .g { font-size: .85rem; }
.comps .role {
  font-size: .62rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--dim);
  border-left: 1px solid var(--line);
  padding-left: .5rem;
}

/* Exemples de mots */
.words { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }

.words li {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: .1rem .8rem;
  align-items: baseline;
  padding: .3rem 0;
}

.words .w { font-family: var(--cjk); font-size: 1.35rem; line-height: 1.2; }
.words .p { font-size: .92rem; font-weight: 600; }
.words .t { grid-column: 2; color: var(--dim); font-size: .85rem; }

/* Étymologie */
.etype {
  display: inline-block;
  font-size: .72rem;
  letter-spacing: .04em;
  color: #14181d;
  background: var(--accent);
  border-radius: 999px;
  padding: .16rem .6rem;
  margin: 0 0 .5rem;
  font-weight: 600;
}

.etext { margin: 0; font-size: .92rem; color: #cdd6e0; }

.note {
  margin: .9rem 0 0;
  padding: .6rem .8rem;
  background: var(--panel-2);
  border: 1px dashed var(--line);
  border-radius: 10px;
  font-size: .85rem;
  color: var(--dim);
}

/* ---------- geste de glissement (téléphone) ---------- */

/* L'enveloppe ne sert qu'au glissement : la carte garde son retournement 3D.
   touch-action: pan-y laisse le défilement vertical au navigateur et ne nous
   donne que les gestes horizontaux. */
.swipe {
  position: relative;
  touch-action: pan-y;
  transition: transform .28s cubic-bezier(.2, .8, .25, 1), opacity .28s ease;
}
.swipe.dragging { transition: none; }

/* Étiquettes qui apparaissent pendant le geste, comme un tampon posé sur la
   carte : « Je sais » à gauche quand on tire vers la droite (et inversement). */
.swipe-tag {
  position: absolute;
  top: 1rem;
  z-index: 3;
  padding: .42rem .9rem;
  border-radius: 999px;
  font-size: .82rem;
  font-weight: 700;
  letter-spacing: .04em;
  opacity: 0;
  pointer-events: none;
}
.swipe-tag.yes { left: 1rem;  background: var(--ok);   color: #14181d; }
.swipe-tag.no  { right: 1rem; background: var(--warn); color: #14181d; }

/* Sur un écran tactile seulement : les indications de geste */
.touch-only { display: none; }
@media (hover: none) and (pointer: coarse) {
  .touch-only { display: inline; }
}

/* Suivi de révision : où en est la fiche, quand elle revient */
.suivi {
  text-align: center;
  color: var(--dim);
  font-size: .78rem;
  margin: .55rem 0 0;
  font-variant-numeric: tabular-nums;
}
.suivi .ok { color: var(--ok); font-weight: 600; }

/* ---------- ordre des traits ---------- */

.traits-bloc { border-top: 1px solid var(--line); padding-top: .75rem; margin-top: auto;     /* colle la section au bas de la carte (la ligne de separation reste) */ }

.traits { margin-top: .8rem; display: flex; flex-direction: column; align-items: center; gap: .55rem; }

/* L'œil qui montre ou cache le carré 田字格. currentColor : l'icône suit le
   thème. */
.traits-oeil {
  appearance: none;
  background: none;
  border: 0;
  padding: .3rem;
  display: block;
  line-height: 0;
  /* L'œil se range à droite ; le carré 田字格, lui, reste centré
     (align-items: center sur .traits, que align-self vient contredire ici). */
  align-self: flex-end;
  margin-right: .25rem;
  color: var(--dim);
  border-radius: 8px;
  cursor: pointer;
  transition: color .2s;
}

.traits-oeil:hover { color: var(--txt); }
.traits-oeil svg { width: 22px; height: 22px; }

/* L'icône annonce l'ACTION à venir, pas l'état courant : œil ouvert = « appuie
   pour afficher » (le cas par défaut, carré caché), œil barré = « appuie pour
   masquer ». C'est aussi ce que dit le libellé lisible par les lecteurs
   d'écran. */
.traits-oeil .oeil-barre { display: none; }
.traits-oeil[aria-pressed="true"] .oeil-ouvert { display: none; }
.traits-oeil[aria-pressed="true"] .oeil-barre { display: inline-block; }

/* Sans cette règle, le display:flex du carré l'emporterait sur l'attribut
   hidden, et le carré resterait visible. */
.traits-box[hidden] { display: none; }

/* Le carré 田字格 : visible directement, un appui dessus lance l'animation.
   Les deux axes du carré d'écriture chinois sont dessinés en dégradés. */
.traits-box {
  width: 200px;
  height: 200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: .6rem;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color .2s, transform .12s;
  background-image:
    linear-gradient(to right, transparent calc(50% - .5px), var(--line) calc(50% - .5px), var(--line) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to bottom, transparent calc(50% - .5px), var(--line) calc(50% - .5px), var(--line) calc(50% + .5px), transparent calc(50% + .5px));
}

.traits-box:hover { border-color: var(--accent); }
.traits-box:active { transform: scale(.985); }
.traits-box .traits-note { margin: 0; }

/* L'invite : un doigt qui tape (icons/tap.webp, image fournie par Matt). Le
   dessin est noir : on l'inverse pour le thème sombre, qui est le thème par
   défaut. Volontairement discrète, elle s'éclaircit au survol. */
.traits-icon {
  display: inline-block;
  width: 44px;
  height: 44px;
  opacity: .55;
  filter: invert(1);          /* thème sombre : le trait noir devient clair */
  transition: opacity .2s;
  animation: invite 1.9s ease-in-out infinite;
}

[data-theme="clair"] .traits-icon { filter: none; }

.traits-box:hover .traits-icon { opacity: .85; }

@keyframes invite {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

.traits-note { text-align: center; color: var(--dim); font-size: .82rem; margin: .6rem 0 0; }

/* ---------- commandes ---------- */
/* Tout ce qui commande est dans le menu : l'écran ne garde que la carte. Seuls
   les deux jugements sont colorés, pour se distinguer des autres entrées. */

/* Sélecteur de niveau : l'onglet en cours est marqué */
.niveaux { display: flex; gap: .5rem; margin: 1rem 0 0; }
.niveaux a {
  padding: .4rem .9rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--dim);
  text-decoration: none;
  font-size: .85rem;
}
.niveaux a:hover { color: var(--txt); border-color: var(--accent); }
.niveaux a.actif { color: var(--accent); border-color: var(--accent); font-weight: 600; }

/* ---------- pied ---------- */

/* Le bandeau est passé ici, fusionné avec le pied : plus rien ne surplombe la
   carte, qui occupe le haut de l'écran. */
/* ---------- accessibilité et petits écrans ---------- */

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  * { animation: none !important; }
}

@media (max-width: 560px) {
  .wrap { width: min(1120px, 100% - 1.4rem); }
  .face { padding: .8rem .9rem; }
  /* Plus de hauteur imposee : la carte suit la place disponible. */
  .card { min-height: 200px; }
  .words li { grid-template-columns: 1fr; }
  .words .t { grid-column: 1; }
}

/* ---------- la barre du bas : informations, progression, onglets ---------- */
/* Barre flottante arrondie : icônes seules, halo doux sous l'onglet actif.
   Elle reste dans le flux : la page tient dans l'écran, rien ne la recouvre. */
.bas {
  position: relative;                 /* ancre des feuilles */
  /* La barre ne doit jamais etre comprimee : enfant d'une colonne flex, elle a
     flex-shrink: 1 par defaut, et c'est elle qui encaissait le manque de hauteur
     quand la carte, protegee par son min-height, refusait de se reduire. */
  flex: 0 0 auto;
  width: 100%;                        /* pleine largeur : plus de plafond a 680 px */
  /* Sans ce min-width: 0, un element flex garde une largeur minimale egale a
     celle de son contenu : la barre s'elargissait donc avec le texte des
     compteurs (« 0 sues » puis « 250 sues »), et depassait la fenetre. */
  min-width: 0;
  margin: 0;
  background: var(--panel);
  /* Une seule declaration de bordure haute. Le theme sombre est celui de base :
     une arete claire detache la barre de la page, alors qu'une ombre noire sur
     fond noir ne se verrait pas. Le theme clair ne change que la couleur. */
  border-top: 1px solid rgba(255, 255, 255, .07);
  box-shadow: 0 -10px 30px rgba(0, 0, 0, .45);
  padding: .3rem .6rem calc(.3rem + env(safe-area-inset-bottom, 0px));
}

.bas .bar {
  height: 3px;
  margin: .3rem .35rem .15rem;
  border-radius: 999px;
  background: var(--panel-2);
  overflow: hidden;
}
.bas .bar span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--ok));
  transition: width .3s;
}

/* Les onglets : icône seule, le halo est dessiné par le padding de l'icône */
.onglets { display: grid; grid-template-columns: repeat(5, 1fr); gap: .1rem; grid-auto-rows: 44px; }

.onglet {
  appearance: none;
  background: none;
  border: 0;
  padding: .15rem 0 .2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  /* Un bouton sans texte garde une boite de ligne, dont la hauteur depend du
     moteur et du jeu de couleurs : c'est elle qui faisait varier la hauteur de
     la barre d'un theme a l'autre. */
  font: inherit;
  font-size: 0;
  line-height: 0;
  color: var(--dim);
  cursor: pointer;
  height: 100%;
  border-radius: 999px;
}

.onglet svg {
  display: block;
  /* Un trait clair sur fond sombre paraît plus fin : on l'épaissit un peu. */
  stroke-width: 2;
  /* Sans ca, le box-sizing global fait que 24 px est la boite ENTIERE : le halo
     mange le dessin, qui ne fait plus que ~11 px. */
  box-sizing: content-box;
  width: 24px;
  height: 24px;
  padding: .42rem;
  border-radius: 999px;
  transition: background-color .2s, color .2s;
}
.onglet:hover { color: var(--txt); }
.onglet.actif { color: var(--accent); }
.onglet.actif svg { background: rgba(216, 178, 106, .16); }
[data-theme="clair"] .onglet.actif svg { background: rgba(138, 100, 21, .14); }

/* La feuille : ce que l'onglet ouvre, posée juste au-dessus de la barre */
.feuille {
  position: absolute;
  /* Centrage par translation : deux bords égaux ne garantissent pas un
     centrage visuel (arrondis, ascenseur interne, marges des enfants). Là,
     la feuille est centrée par construction : 50 % moins la moitié de sa
     largeur. La largeur est celle de la barre moins .9rem de chaque côté. */
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 1.8rem);
  bottom: calc(100% + .5rem);
  background: var(--panel);
  /* En sombre, --line est trop proche du fond et l'ombre noire ne se voit pas :
     c'est cette bordure plus claire qui detache la feuille, comme l'arete de la barre. */
  border: 1px solid rgba(255, 255, 255, .09);
  border-radius: 18px;
  box-shadow: 0 -10px 34px rgba(0, 0, 0, .55);
  padding: .45rem .5rem .55rem;
  max-height: min(72vh, 560px);   /* trois sections dans Réglages */
  overflow-y: auto;
}
.feuille[hidden] { display: none; }

.feuille-titre {
  margin: .5rem .6rem .2rem;
  font-size: .62rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}
.feuille-titre:first-child { margin-top: .2rem; }

.feuille-entree,
.feuille a {
  display: block;
  width: 100%;
  text-align: left;
  padding: .6rem .7rem;
  border: 0;
  border-radius: 12px;
  background: none;
  color: var(--txt);
  font: inherit;
  font-size: .92rem;
  text-decoration: none;
  cursor: pointer;
}
.feuille-entree:hover,
.feuille a:hover { background: var(--panel-2); }
.feuille-entree.ok { color: var(--ok); }
.feuille-entree.warn { color: var(--accent); }
.feuille-entree kbd { margin-left: .45rem; opacity: .7; }
.feuille a.actif { color: var(--accent); font-weight: 600; }
.feuille a.actif::after { content: ' ✓'; }

/* Sur le papier de riz, une ombre noire parait lourde : elle est plus douce et
   chaude. C'est aussi ce qui donne l'impression que la barre change de taille
   en basculant. */
[data-theme="clair"] .bas {
  border-top-color: var(--line);
  box-shadow: 0 -6px 18px rgba(80, 66, 34, .10);
}
[data-theme="clair"] .onglet svg { stroke-width: 1.8; }
[data-theme="clair"] .feuille {
  border-color: var(--line);
  box-shadow: 0 -6px 22px rgba(80, 66, 34, .16);
}

/* Le numero de version, discret, dans Reglages : il dit ce que le navigateur a charge. */
.version { margin: .7rem .6rem .2rem; color: var(--dim); font-size: .7rem; opacity: .8; }

/* La phrase d'exemple : le caractère en situation, juste sous le sens.
   Un liseré doré à gauche, comme une citation. */
.phrase {
  margin-top: .9rem;
  padding: .7rem .85rem;
  border-left: 3px solid var(--accent);
  background: var(--panel-2);
  border-radius: 0 10px 10px 0;
}
.phrase p { margin: 0; }
.phrase .phrase-zh {
  font-family: var(--cjk);
  font-size: 1.18rem;
  line-height: 1.5;
  color: var(--txt);
}
.phrase .phrase-py {
  margin-top: .25rem;
  font-size: .84rem;
  font-style: italic;
  color: var(--dim);
}
.phrase .phrase-fr {
  margin-top: .35rem;
  font-size: .92rem;
  color: var(--txt);
}
.phrase .phrase-note {
  margin-top: .45rem;
  padding-top: .4rem;
  border-top: 1px dashed var(--line);
  font-size: .82rem;
  color: var(--dim);
}

/* Les trois lignes de suivi vivent dans la feuille « Cette carte » : c'est de
   là qu'on marque, donc c'est là qu'on veut voir le compteur bouger. Vides, on
   les laisse disparaître — aucune hauteur perdue. */
.feuille-info {
  margin: -.25rem 0 .45rem;
  font-size: .82rem;
  color: var(--dim);
}
.feuille-info:empty { display: none; }

/* La pastille de l'onglet : combien de cartes à revoir, sans ouvrir la feuille
   (utile quand on juge au glissement). */
.onglet { position: relative; }
.onglet-badge {
  position: absolute;
  top: 4px;
  left: 50%;
  transform: translateX(13px);
  min-width: 16px;
  padding: 0 4px;
  border-radius: 9px;
  background: var(--accent);
  color: #10171d;
  font-size: 10px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
}
.onglet-badge[hidden] { display: none; }

/* Le décompte du jour : « 12 consultées · 9 je sais · 3 à revoir ». */
.feuille-info#aujourdhui { color: var(--accent); }

/* Le tableau de bord du jour : un libellé à gauche, un nombre à droite. Ce
   sont des affichages, plus des boutons — on juge au glissement. */
.feuille-jour {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: .4rem 0;
  padding: .1rem .1rem .1rem 0;
  border-bottom: 1px solid rgba(127, 127, 127, .12);
  font-size: .95rem;
}
.feuille-jour:last-of-type { border-bottom: 0; }
.feuille-jour b {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.feuille-entree { display: flex; align-items: center; }

/* La navigation des pages hors carte (theme.html) : les mêmes sections que les
   onglets du bas, en liens simples — une page qui défile n'a pas de barre fixe. */
/* La page Thèmes porte la même barre que les cartes, fixée en bas de l'écran :
   on peut donc naviguer dans l'application depuis n'importe où, sans défiler.
   Le bas de page est dégagé pour que rien ne passe dessous. */
.page-themes { padding-bottom: 72px; }
.page-themes .bas {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;   /* au-dessus de la page d'accueil */
}
.page-themes .onglet {
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

/* Accueil : le champ de recherche et la liste de résultats. La feuille a peu
   de hauteur libre, donc la liste défile sur place au-delà de trois lignes. */
.feuille .recherche { margin: 0 0 .4rem; }
.feuille-resultats { display: flex; flex-direction: column; gap: .15rem; max-height: 34vh; overflow-y: auto; }
.feuille-resultats:empty { display: none; }
.feuille .resultat {
  display: flex;
  align-items: baseline;
  gap: .55rem;
  width: 100%;
  padding: .5rem .65rem;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--txt);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.feuille .resultat:hover { background: var(--panel-2); }
.feuille .resultat b { font-size: 1.15rem; line-height: 1; }
.feuille .resultat span { color: var(--dim); font-size: .82rem; }

/* La feuille Accueil est une page de départ, pas un menu posé sur la carte :
   tant qu'elle est ouverte, la carte disparaît. La feuille occupe alors le
   bas de l'écran, et le reste ne montre que le fond de la page. */
body.page-ouverte main { visibility: hidden; }

/* Accueil est une page, pas une feuille : elle occupe la surface au-dessus de
   la carte, et la barre reste visible en bas — d'où le dégagement et le
   z-index, la barre passant au-dessus. */
.bas { position: relative; z-index: 20; }
.page {
  position: fixed;
  inset: 0;
  z-index: 15;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  padding: 1rem 1rem calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  overflow-y: auto;
}
.page[hidden] { display: none; }
.accueil-titre {
  margin: 0 0 .3rem;
  font-size: .8rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--dim);
}
.page .recherche { margin: 0; }
.page .feuille-resultats { max-height: none; }
/* La page « Cartes à revoir » : une grille de mini-cartes. Le caractère en
   grand, le pinyin coloré par ton, un appui ouvre la fiche. */
#revoir-liste {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(94px, 1fr));
  gap: .5rem;
  max-height: none;
}
.mini-carte {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .2rem;
  aspect-ratio: 3 / 4;
  padding: .75rem .4rem;
  border: 1px solid rgba(127, 127, 127, .22);
  border-radius: 12px;
  background: var(--panel-2);
  color: var(--txt);
  font: inherit;
  cursor: pointer;
}
.mini-carte:hover,
.mini-carte:focus-visible { border-color: var(--accent); }
.mc-glyphe { font-size: 2rem; line-height: 1.1; }
/* La page est une colonne flex : sans ça, la liste des résultats comprime le
   champ de recherche, et il devient illisible ou insaisissable. Le champ garde
   sa hauteur, la liste prend le reste. */
.page .recherche { flex: 0 0 auto; }
.page .feuille-resultats { flex: 1 1 auto; min-height: 0; }
/* Le nom de l'application, en tête de la page Accueil : les quatre caractères
   en style kai, couleur d'accent. C'est du texte vivant, pas une image — il
   suit donc les deux thèmes, et reste net à toutes les tailles. */
.accueil-marque {
  margin: 0 0 .6rem;
  text-align: center;
  font-family: "KaiTi", "Kaiti SC", "STKaiti", var(--cjk), serif;
  font-size: 1.55rem;
  line-height: 1.15;
  letter-spacing: .05em;
  color: var(--accent);
}
/* Le libellé du champ de recherche : discret, centré comme le nom. */
.accueil-label {
  display: block;
  margin: 0 0 .1rem;
  text-align: center;
  font-size: .76rem;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--dim);
}
</style>

<!-- Applique le thème choisi AVANT le premier affichage : sans ça, on verrait
     un flash clair au chargement quand on a choisi le mode sombre. -->
<script>
(function () {
  try {
    if (localStorage.getItem('hanzi-theme') === 'clair') {
      document.documentElement.setAttribute('data-theme', 'clair');
    }
  } catch (e) { /* navigation privée : on garde le thème par défaut */ }
})();
</script>
