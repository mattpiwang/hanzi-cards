<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes 汉字 — hors ligne</title>
<meta name="description" content="Cartes de révision français / chinois : caractère au recto, pinyin, radicaux, exemples et étymologie au verso.">
<style>
/* Cartes français / chinois — feuille de style unique, aucune dépendance. */

:root {
  --bg: #0e1114;
  --panel: #161b21;
  --panel-2: #1c222a;
  --line: #262e38;
  --txt: #e9eef4;
  --dim: #8b98a6;
  --accent: #d8b26a;      /* doré, comme le portfolio photo */
  --ok: #3ecf8e;
  --warn: #f0b429;

  /* Couleurs des tons : convention classique (1 rouge, 2 orange, 3 vert, 4 bleu) */
  --t1: #ff6b6b;
  --t2: #ffb057;
  --t3: #4ecb71;
  --t4: #5aa9ff;
  --t0: #9aa7b4;

  --radius: 18px;
  /* Pile de polices chinoises : KaiTi (calligraphique) si présent, sinon YaHei */
  --cjk: "KaiTi", "STKaiti", "Kaiti SC", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", serif;
}

/* Mode clair : « papier de riz ». Les fibres sont dessinées en CSS — deux
   dégradés répétés très pâles — donc aucune image à charger. */
[data-theme="clair"] {
  --bg: #f3ecda;        /* le papier de riz */
  --panel: #fbf7ec;     /* la feuille posée dessus */
  --panel-2: #ece3ce;
  --line: #dbd0b6;
  --txt: #2a251c;       /* encre de Chine */
  --dim: #6b6250;       /* assombri : 5,1:1 sur le papier (AA) */
  --accent: #8a6415;    /* or assombri : lisible sur le papier */
  --ok: #1d8f5b;
  --warn: #b0731a;

  /* Les tons sont foncés : les teintes vives du mode sombre baveraient ici. */
  --t1: #b8342a;
  --t2: #9a5209;
  --t3: #1a7541;
  --t4: #2a5f9e;
  --t0: #6d7480;
}

[data-theme="clair"] body {
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(115deg, rgba(150, 125, 80, .05) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(25deg,  rgba(150, 125, 80, .035) 0 1px, transparent 1px 11px);
}

/* Trois détails qui ne passent pas par des variables */
[data-theme="clair"] .glyph { color: #211d16; text-shadow: 0 6px 24px rgba(80, 60, 20, .12); }
[data-theme="clair"] .etext { color: #4a4235; }
[data-theme="clair"] .menu-panel { box-shadow: 0 18px 40px rgba(90, 70, 30, .18); }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font: 16px/1.6 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.wrap { width: min(1120px, 100% - 2.5rem); margin-inline: auto; }

kbd {
  font: 600 .72em/1 ui-monospace, Consolas, monospace;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: .18em .4em;
  color: var(--dim);
}

/* ---------- en-tête ---------- */

.top { border-bottom: 1px solid var(--line); padding: 1.1rem 0; }

.top-inner {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  align-items: center;
  justify-content: space-between;
}

.brand { display: flex; align-items: center; gap: .85rem; }

.logo {
  font-family: var(--cjk);
  font-size: 2rem;
  line-height: 1;
  color: var(--accent);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: .3rem .55rem;
  background: var(--panel);
}

.brand h1 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; }
.sub { margin: .1rem 0 0; color: var(--dim); font-size: .82rem; }

.stats { flex: 1 1 240px; max-width: 340px; }

.bar {
  height: 6px;
  background: var(--panel-2);
  border-radius: 999px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--ok));
  transition: width .35s ease;
}

.counters { margin: .45rem 0 0; color: var(--dim); font-size: .8rem; font-variant-numeric: tabular-nums; }

/* ---------- menu (burger) ---------- */

.menu { position: relative; }

.menu-btn {
  appearance: none;
  width: 42px;
  height: 42px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: border-color .2s;
}

.menu-btn:hover { border-color: #38424e; }

/* Les trois barres sont dessinées en CSS : rien à charger, et elles se
   transforment en croix quand le menu est ouvert. */
.burger,
.burger::before,
.burger::after {
  display: block;
  width: 18px;
  height: 2px;
  background: var(--txt);
  border-radius: 2px;
  position: relative;
  transition: transform .2s, top .2s, background-color .2s;
}
.burger::before,
.burger::after { content: ''; position: absolute; }
.burger::before { top: -6px; }
.burger::after { top: 6px; }

.menu-btn[aria-expanded="true"] .burger { background: transparent; }
.menu-btn[aria-expanded="true"] .burger::before { top: 0; transform: rotate(45deg); }
.menu-btn[aria-expanded="true"] .burger::after { top: 0; transform: rotate(-45deg); }

.menu-panel {
  position: absolute;
  right: 0;
  top: calc(100% + .5rem);
  z-index: 20;
  min-width: 230px;
  display: flex;
  flex-direction: column;
  padding: .35rem;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
}
.menu-panel[hidden] { display: none; }

/* Titre de groupe dans le menu : juger, parcourir, progression, apparence */
.menu-titre {
  margin: .85rem .7rem .2rem;
  font-size: .62rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}

.menu-titre:first-child { margin-top: .3rem; }
.menu-panel a,
.menu-item {
  appearance: none;
  background: none;
  border: 0;
  text-align: left;
  padding: .55rem .7rem;
  border-radius: 8px;
  color: var(--txt);
  font: inherit;
  font-size: .9rem;
  text-decoration: none;
  cursor: pointer;
}
.menu-panel a:hover,
.menu-item:hover { background: var(--panel-2); }


/* ---------- interrupteur 阴 / 阳 ---------- */

.switch {
  appearance: none;
  display: flex;
  align-items: center;
  gap: .5rem;
  width: 100%;
  padding: .55rem .7rem;
  background: none;
  border: 0;
  border-radius: 8px;
  color: var(--txt);
  font: inherit;
  font-size: .9rem;
  text-align: left;
  cursor: pointer;
}
.switch:hover { background: var(--panel-2); }

/* Le caractère du mode actif passe en doré */
.sw-yin, .sw-yang {
  font-family: var(--cjk);
  font-size: 1.08rem;
  line-height: 1;
  color: var(--dim);
  transition: color .2s;
}
.switch[aria-checked="false"] .sw-yin { color: var(--accent); }
.switch[aria-checked="true"] .sw-yang { color: var(--accent); }

.sw-track {
  position: relative;
  width: 38px;
  height: 20px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  transition: background-color .2s, border-color .2s;
}

.sw-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--dim);
  transition: transform .2s, background-color .2s;
}

.switch[aria-checked="true"] .sw-track { background: rgba(216, 178, 106, .28); border-color: var(--accent); }
.switch[aria-checked="true"] .sw-knob { transform: translateX(18px); background: var(--accent); }

.sw-label { margin-left: auto; color: var(--dim); font-size: .78rem; }

/* ---------- page « Thèmes » ---------- */

.page-head { padding: 1.4rem 0 .4rem; }
.page-head h1 { margin: 0; font-size: 1.25rem; }
.page-head p { margin: .3rem 0 0; color: var(--dim); font-size: .87rem; }

.bloc { margin-top: 1.7rem; }

.bloc-titre {
  margin: 0 0 .6rem;
  font-size: .68rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}

.resume { margin: 0 0 .8rem; font-size: .93rem; }
.resume strong { color: var(--accent); font-variant-numeric: tabular-nums; }

/* Prévision des sept prochains jours */
.prevision { display: grid; gap: .4rem; }

.jour { display: flex; align-items: center; gap: .6rem; font-size: .82rem; color: var(--dim); }
.jour .j-nom { width: 6.5rem; }
.jour .j-n { width: 2.2rem; text-align: right; font-variant-numeric: tabular-nums; }
.jour .t-bar { flex: 1; }

.recherche {
  width: 100%;
  padding: .6rem .8rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: var(--txt);
  font: inherit;
  font-size: .9rem;
}
.recherche::placeholder { color: var(--dim); }
.recherche:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

.themes { display: grid; gap: .55rem; margin: 1.1rem 0 2.5rem; }
.bloc .themes { margin: .8rem 0 0; }

.theme-row {
  display: flex;
  align-items: center;
  gap: .9rem;
  padding: .85rem 1rem;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--txt);
  text-decoration: none;
  transition: border-color .2s, background-color .2s;
}
.theme-row:hover { border-color: var(--accent); background: var(--panel-2); }

.theme-row .t-main { flex: 1; }
.theme-row .t-name { display: block; font-weight: 600; }
.theme-row .t-count { display: block; margin-top: .15rem; color: var(--dim); font-size: .82rem; }
.theme-row .t-bar { width: 74px; height: 5px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.theme-row .t-bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); }

/* Résultat de recherche : le caractère, puis pinyin et sens */
.theme-row .t-glyphe {
  font-family: var(--cjk);
  font-size: 1.9rem;
  line-height: 1;
  min-width: 2.4rem;
  text-align: center;
}
.theme-row .t-ok {
  color: var(--ok);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .06em;
}

.back-link { display: inline-block; color: var(--dim); font-size: .9rem; text-decoration: none; }
.back-link:hover { color: var(--txt); }

/* ---------- la carte, avec retournement 3D ---------- */

.stage {
  perspective: 1800px;
  margin: 1.6rem auto 1.2rem;
  width: min(680px, 100%);
}

.card {
  position: relative;
  width: 100%;
  height: clamp(430px, 64vh, 620px);
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.45, .05, .25, 1);
  cursor: pointer;
  outline: none;
}

.card.flipped { transform: rotateY(180deg); }
.card:focus-visible .face { border-color: var(--accent); }

.face {
  position: absolute;
  inset: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  padding: 1.6rem 1.7rem;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Recto : le caractère seul, très grand, sur un fond légèrement lumineux */
.front {
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  background:
    radial-gradient(circle at 50% 42%, rgba(216, 178, 106, .10), transparent 62%),
    var(--panel);
}

.glyph {
  font-family: var(--cjk);
  font-size: clamp(6rem, 21vw, 11rem);
  line-height: 1;
  letter-spacing: .04em;
  color: #f4f7fa;
  text-shadow: 0 6px 30px rgba(0, 0, 0, .5);
}

.hint { margin: 0; color: var(--dim); font-size: .78rem; }

/* Verso : défile si le contenu dépasse (étymologies longues) */
.back {
  transform: rotateY(180deg);
  background: var(--panel);
  overflow-y: auto;
  gap: .2rem;
  cursor: default;
}

.back-head { text-align: center; padding-bottom: .9rem; }

.pinyin {
  font-size: clamp(1.9rem, 5vw, 2.5rem);
  font-weight: 600;
  letter-spacing: .01em;
  line-height: 1.15;
}

.tone-1 { color: var(--t1); }
.tone-2 { color: var(--t2); }
.tone-3 { color: var(--t3); }
.tone-4 { color: var(--t4); }
.tone-0 { color: var(--t0); }

.meaning { color: var(--txt); font-size: 1.02rem; margin-top: .15rem; }

/* Sens pas encore traduit : discret, et jamais en anglais */
.meaning .manquant {
  color: var(--dim);
  font-size: .82em;
  font-style: italic;
}

.back section { border-top: 1px solid var(--line); padding-top: .75rem; margin-top: .75rem; }

.back h3 {
  margin: 0 0 .5rem;
  font-size: .68rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}

/* Radicaux : chaque composant dans une pastille */
.comps { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; }

.comps li {
  display: flex;
  align-items: center;
  gap: .55rem;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: .4rem .7rem;
}

.comps .r { font-family: var(--cjk); font-size: 1.5rem; line-height: 1; }
.comps .g { font-size: .85rem; }
.comps .role {
  font-size: .62rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--dim);
  border-left: 1px solid var(--line);
  padding-left: .5rem;
}

/* Exemples de mots */
.words { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }

.words li {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: .1rem .8rem;
  align-items: baseline;
  padding: .3rem 0;
}

.words .w { font-family: var(--cjk); font-size: 1.35rem; line-height: 1.2; }
.words .p { font-size: .92rem; font-weight: 600; }
.words .t { grid-column: 2; color: var(--dim); font-size: .85rem; }

/* Étymologie */
.etype {
  display: inline-block;
  font-size: .72rem;
  letter-spacing: .04em;
  color: #14181d;
  background: var(--accent);
  border-radius: 999px;
  padding: .16rem .6rem;
  margin: 0 0 .5rem;
  font-weight: 600;
}

.etext { margin: 0; font-size: .92rem; color: #cdd6e0; }

.note {
  margin: .9rem 0 0;
  padding: .6rem .8rem;
  background: var(--panel-2);
  border: 1px dashed var(--line);
  border-radius: 10px;
  font-size: .85rem;
  color: var(--dim);
}

/* ---------- geste de glissement (téléphone) ---------- */

/* L'enveloppe ne sert qu'au glissement : la carte garde son retournement 3D.
   touch-action: pan-y laisse le défilement vertical au navigateur et ne nous
   donne que les gestes horizontaux. */
.swipe {
  position: relative;
  touch-action: pan-y;
  transition: transform .28s cubic-bezier(.2, .8, .25, 1), opacity .28s ease;
}
.swipe.dragging { transition: none; }

/* Étiquettes qui apparaissent pendant le geste, comme un tampon posé sur la
   carte : « Je sais » à gauche quand on tire vers la droite (et inversement). */
.swipe-tag {
  position: absolute;
  top: 1rem;
  z-index: 3;
  padding: .42rem .9rem;
  border-radius: 999px;
  font-size: .82rem;
  font-weight: 700;
  letter-spacing: .04em;
  opacity: 0;
  pointer-events: none;
}
.swipe-tag.yes { left: 1rem;  background: var(--ok);   color: #14181d; }
.swipe-tag.no  { right: 1rem; background: var(--warn); color: #14181d; }

/* Sur un écran tactile seulement : les indications de geste */
.touch-only { display: none; }
@media (hover: none) and (pointer: coarse) {
  .touch-only { display: inline; }
}

/* Suivi de révision : où en est la fiche, quand elle revient */
.suivi {
  text-align: center;
  color: var(--dim);
  font-size: .78rem;
  margin: .55rem 0 0;
  font-variant-numeric: tabular-nums;
}
.suivi .ok { color: var(--ok); font-weight: 600; }

/* ---------- ordre des traits ---------- */

.traits-bloc { border-top: 1px solid var(--line); padding-top: .75rem; margin-top: .75rem; }

.traits { margin-top: .8rem; }

/* Le carré 田字格 : visible directement, un appui dessus lance l'animation.
   Les deux axes du carré d'écriture chinois sont dessinés en dégradés. */
.traits-box {
  width: 200px;
  height: 200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: .6rem;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color .2s, transform .12s;
  background-image:
    linear-gradient(to right, transparent calc(50% - .5px), var(--line) calc(50% - .5px), var(--line) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to bottom, transparent calc(50% - .5px), var(--line) calc(50% - .5px), var(--line) calc(50% + .5px), transparent calc(50% + .5px));
}

.traits-box:hover { border-color: var(--accent); }
.traits-box:active { transform: scale(.985); }
.traits-box .traits-note { margin: 0; }

/* L'invite : un doigt qui tape (icons/tap.webp, image fournie par Matt). Le
   dessin est noir : on l'inverse pour le thème sombre, qui est le thème par
   défaut. Volontairement discrète, elle s'éclaircit au survol. */
.traits-icon {
  display: inline-block;
  width: 44px;
  height: 44px;
  opacity: .55;
  filter: invert(1);          /* thème sombre : le trait noir devient clair */
  transition: opacity .2s;
  animation: invite 1.9s ease-in-out infinite;
}

[data-theme="clair"] .traits-icon { filter: none; }

.traits-box:hover .traits-icon { opacity: .85; }

@keyframes invite {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

.traits-note { text-align: center; color: var(--dim); font-size: .82rem; margin: .6rem 0 0; }

/* ---------- commandes ---------- */
/* Tout ce qui commande est dans le menu : l'écran ne garde que la carte. Seuls
   les deux jugements sont colorés, pour se distinguer des autres entrées. */

.menu-item.ok { color: var(--ok); }
.menu-item.warn { color: var(--accent); }
.menu-item kbd { margin-left: .45rem; opacity: .7; }

/* ---------- pied ---------- */

/* Réduit au strict minimum : la place dans le paquet. Les commandes et les
   raccourcis sont dans le menu, l'invite est sur la carte elle-même. */
.foot {
  padding: 0 0 .9rem;
  color: var(--dim);
  font-size: .78rem;
  text-align: center;
}

.pos { font-variant-numeric: tabular-nums; }

/* ---------- accessibilité et petits écrans ---------- */

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  * { animation: none !important; }
}

@media (max-width: 560px) {
  .wrap { width: min(1120px, 100% - 1.4rem); }
  .face { padding: 1.1rem 1.15rem; }
  .card { height: clamp(440px, 72vh, 640px); }
  .words li { grid-template-columns: 1fr; }
  .words .t { grid-column: 1; }
}

</style>

<!-- Applique le thème choisi AVANT le premier affichage : sans ça, on verrait
     un flash clair au chargement quand on a choisi le mode sombre. -->
<script>
(function () {
  try {
    if (localStorage.getItem('hanzi-theme') === 'clair') {
      document.documentElement.setAttribute('data-theme', 'clair');
    }
  } catch (e) { /* navigation privée : on garde le thème par défaut */ }
})();
</script>

<!-- Installation sur téléphone : manifeste, icônes, couleur de la barre système -->

<meta name="theme-color" content="#0e1114">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cartes 汉字">
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <span class="logo">汉</span>
      <div>
        <h1>Cartes</h1>
        <p class="sub" id="deck-name">chargement…</p>
      </div>
    </div>
    <div class="stats">
      <div class="bar" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100"><span id="bar-fill"></span></div>
      <p id="counters" class="counters">…</p>
    </div>
    <nav class="menu">
      <button id="menu-toggle" class="menu-btn" type="button"
              aria-expanded="false" aria-controls="menu-panel" aria-label="Menu">
        <span class="burger" aria-hidden="true"></span>
      </button>
      <div class="menu-panel" id="menu-panel" hidden>
        <!-- Les deux jugements portent sur la carte affichée -->

<script>
/* Cartes français / chinois — logique de révision, sans aucune dépendance.
   Style volontairement simple (var, fonctions nommées) pour rester lisible. */

(function () {
  'use strict';

  var STORE_KEY = 'hanzi-cards-v1';

  /* Le ton n'est pas stocké dans les données : on le déduit du diacritique du
     pinyin. Une seule table suffit, et elle sert aussi à colorer les exemples. */
  var TONES = {
    'ā': 1, 'ē': 1, 'ī': 1, 'ō': 1, 'ū': 1, 'ǖ': 1,
    'á': 2, 'é': 2, 'í': 2, 'ó': 2, 'ú': 2, 'ǘ': 2,
    'ǎ': 3, 'ě': 3, 'ǐ': 3, 'ǒ': 3, 'ǔ': 3, 'ǚ': 3,
    'à': 4, 'è': 4, 'ì': 4, 'ò': 4, 'ù': 4, 'ǜ': 4
  };

  /* Seuil de maîtrise : au-delà de 2, la carte sort du paquet « à revoir ».
     Compteur simple à trois états — 0 jamais vue, 1 à revoir, 2 en cours, 3 sue. */
  /* Le rythme des révisions est décrit plus bas, avec la mécanique SM-2. */

  var state = {
    cards: [],
    view: [],          // cartes affichées, dans l'ordre courant
    i: 0,              // index dans view
    flipped: false,
    titre: '',         // thème en cours, quand il vient de l'adresse
    reviewMode: false, // vue « à revoir aujourd'hui » (?review=1)
    progress: {}       // { "好": { n: 2, ef: 2.5, i: 6, due: "2026-10-19", … } }
  };

  var el = {
    deckName: document.getElementById('deck-name'),
    card: document.getElementById('card'),
    front: document.getElementById('front-glyph'),
    back: document.getElementById('back'),
    counters: document.getElementById('counters'),
    bar: document.getElementById('bar-fill'),
    position: document.getElementById('position')
  };

  /* ------------------------------------------------------------------ */
  /*  Utilitaires                                                        */
  /* ------------------------------------------------------------------ */

  function toneOf(pinyin) {
    for (var i = 0; i < pinyin.length; i++) {
      if (TONES[pinyin[i]]) { return TONES[pinyin[i]]; }
    }
    return 0; // ton neutre
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Répétition espacée (SM-2)                                          */
  /* ------------------------------------------------------------------ */

  /* Chaque fiche garde :
       n     réussites d'affilée
       ef    facteur de facilité (2,5 au départ, borné entre 1,3 et 2,8)
       i     intervalle courant, en jours
       due   date de la prochaine révision (AAAA-MM-JJ)
       seen  nombre total de révisions
       at    date de la dernière révision

     Réussie : les intervalles suivent 1 jour, 6 jours, puis i × ef — c'est la
     formule de SuperMemo 2. Manquée : retour à un jour, et la facilité baisse,
     donc tous les intervalles suivants raccourcissent. */
  var JOUR = 86400000;
  var EF_DEPART = 2.5, EF_MIN = 1.3, EF_MAX = 2.8;
  var MAITRISE = 21;   // au-delà de trois semaines d'intervalle, la carte est sue

  function aujourdhui() {
    return new Date().toISOString().slice(0, 10);
  }

  function dansNJours(n) {
    return new Date(Date.now() + n * JOUR).toISOString().slice(0, 10);
  }

  function fiche(char) {
    if (!state.progress[char]) {
      state.progress[char] = { n: 0, ef: EF_DEPART, i: 0, due: aujourdhui(), seen: 0, at: '' };
    }
    return state.progress[char];
  }

  function estDue(card) {
    return fiche(card.char).due <= aujourdhui();
  }

  function estMaitrisee(card) {
    return fiche(card.char).i >= MAITRISE;
  }

  /* Révision : « Je sais » compte comme une qualité 5, « À revoir » comme 2. */
  function reviser(card, connu) {
    var f = fiche(card.char);
    if (connu) {
      f.n = f.n + 1;
      if (f.n === 1) { f.i = 1; }
      else if (f.n === 2) { f.i = 6; }
      else { f.i = Math.round(Math.max(f.i, 6) * f.ef); }
      f.ef = Math.min(EF_MAX, f.ef + 0.1);
    } else {
      f.n = 0;
      f.i = 1;
      f.ef = Math.max(EF_MIN, f.ef - 0.32);
    }
    f.due = dansNJours(f.i);
    f.seen = f.seen + 1;
    f.at = aujourdhui();
    save();
    return f;
  }

  /* La progression est enregistrée dans le navigateur. Deux cas où ça échoue :
     navigation privée, et fichier ouvert en file:// (Chrome l'interdit). Dans ce
     cas on continue simplement en mémoire : l'app reste utilisable, la
     progression est perdue à la fermeture. */
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state.progress)); }
    catch (e) { /* on ignore : mode privé ou file:// */ }
  }

  /* Les anciennes fiches portaient un simple compteur « box ». On les traduit
     une fois pour toutes au chargement : 0/1 → à revoir, 2 → 1 jour, 3 → 6 jours. */
  function migrerProgression() {
    var change = false;
    Object.keys(state.progress).forEach(function (ch) {
      var p = state.progress[ch];
      if (p && p.ef === undefined) {
        var n = p.box >= 3 ? 2 : (p.box >= 2 ? 1 : 0);
        state.progress[ch] = {
          n: n,
          ef: EF_DEPART,
          i: n === 2 ? 6 : (n === 1 ? 1 : 0),
          due: n === 2 ? dansNJours(6) : aujourdhui(),
          seen: p.seen || 0,
          at: p.at || ''
        };
        change = true;
      }
    });
    if (change) { save(); }
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) { state.progress = JSON.parse(raw) || {}; }
    } catch (e) { state.progress = {}; }
    migrerProgression();
  }

  function masteredCount() {
    return state.cards.filter(estMaitrisee).length;
  }

  /* Ce qui est « à revoir » : ce qui est dû aujourd'hui ou en retard. */
  function toReviewCount() {
    return state.cards.filter(estDue).length;
  }

  /* ------------------------------------------------------------------ */
  /*  Rendu                                                              */
  /* ------------------------------------------------------------------ */

  function current() {
    return state.view[state.i];
  }

  /* Le verso concentre tout ce qui est demandé : pinyin, radicaux, exemples de
     mots, étymologie. */
  function backHTML(c) {
    /* Chaque section n'apparaît que si la donnée existe : les fiches
       importées n'ont pas d'exemples de mots, et certaines n'ont pas de
       radicaux exploitables dans la source. */
    var compsHTML = (c.components && c.components.length)
      ? '<section><h3>Radicaux</h3><ul class="comps">' +
          c.components.map(function (t) {
            return '<li><span class="r">' + esc(t[0]) + '</span>' +
                   '<span class="g">' + esc(t[1]) + '</span>' +
                   '<span class="role">' + esc(t[2]) + '</span></li>';
          }).join('') +
        '</ul></section>'
      : '';

    var wordsHTML = (c.words && c.words.length)
      ? '<section><h3>Exemples</h3><ul class="words">' +
          c.words.map(function (t) {
            return '<li><span class="w">' + esc(t[0]) + '</span>' +
                   '<span class="p tone-' + toneOf(t[1]) + '">' + esc(t[1]) + '</span>' +
                   '<span class="t">' + esc(t[2]) + '</span></li>';
          }).join('') +
        '</ul></section>'
      : '';

    /* Aucun anglais à l'écran, jamais : si la traduction française manque
       encore, on l'annonce discrètement. L'anglais reste dans les données
       (champ meaningEn) : il sert de base à la traduction, rien de plus. */
    var sens = c.meaning
      ? esc(c.meaning)
      : '<span class="manquant">sens à compléter</span>';

    var etymoHTML = (c.etymology && c.etymology.length)
      ? '<section><h3>Étymologie</h3>' +
          '<p class="etype">' + esc(c.etymology[0]) + '</p>' +
          (c.etymology[1] ? '<p class="etext">' + esc(c.etymology[1]) + '</p>' : '') +
        '</section>'
      : '';

    /* L'ordre des traits : le carré 田字格 est visible directement, et un appui
       dessus lance (ou relance) l'animation. Absent de la version « un seul
       fichier », qui n'embarque ni la bibliothèque ni les tracés. */
    var traitsHTML = monoFichier ? '' :
      '<section class="traits-bloc">' +
        '<div class="traits" id="traits">' +
          '<div class="traits-box" id="traits-box" title="Appuie pour voir l\'ordre des traits">' +
            '<p class="traits-note">' +
              '<img class="traits-icon" src="icons/tap.webp" alt="" width="44" height="44">' +
            '</p>' +
          '</div>' +
        '</div>' +
      '</section>';

    /* Où en est cette fiche : combien de fois revue, et quand elle revient.
       On lit la progression sans la créer (state.progress, pas fiche()). */
    var suivi = '';
    var p = state.progress[c.char];
    if (p && p.seen) {
      var quand = (p.due && p.due <= aujourdhui())
        ? 'à revoir maintenant'
        : ('prochaine révision dans ' + p.i + ' jour' + (p.i > 1 ? 's' : ''));
      suivi = '<p class="suivi">Revue ' + p.seen + ' fois · ' + esc(quand) +
        (p.i >= MAITRISE ? ' · <span class="ok">maîtrisée</span>' : '') + '</p>';
    }

    return '' +
      '<div class="back-head">' +
        '<div class="pinyin tone-' + toneOf(c.pinyin) + '">' + esc(c.pinyin) + '</div>' +
        '<div class="meaning">' + sens + '</div>' +
      '</div>' +
      suivi +
      compsHTML + wordsHTML + etymoHTML + traitsHTML +
      (c.note ? '<p class="note">' + esc(c.note) + '</p>' : '');
  }

  function render() {
    var c = current();

    if (!c) {
      el.front.textContent = '—';
      el.back.innerHTML = '<p class="meaning">Aucune carte ici.</p>';
      el.position.textContent = '';
      updateStats();
      return;
    }

    el.front.textContent = c.char;
    writer = null;          // le dessin précédent disparaît avec le contenu réécrit
    carteDessinee = '';
    el.back.innerHTML = backHTML(c);
    el.back.scrollTop = 0;

    // On repart toujours du recto quand on change de carte.
    state.flipped = false;
    el.card.classList.remove('flipped');

    el.position.textContent = 'Carte ' + (state.i + 1) + ' / ' + state.view.length + ' · ' + c.category;
    updateStats();
  }

  function updateStats() {
    var total = state.cards.length;
    var known = masteredCount();
    el.counters.textContent = state.view.length + ' carte' + (state.view.length > 1 ? 's' : '') +
      ' · ' + toReviewCount() + ' à revoir · ' + known + ' sue' + (known > 1 ? 's' : '');
    el.bar.style.width = total ? Math.round(known / total * 100) + '%' : '0%';
  }

  /* ------------------------------------------------------------------ */
  /*  Actions                                                            */
  /* ------------------------------------------------------------------ */

  function flip() {
    if (!current()) { return; }
    state.flipped = !state.flipped;
    el.card.classList.toggle('flipped', state.flipped);
  }

  function go(delta) {
    if (!state.view.length) { return; }
    // Navigation circulaire : après la dernière, on revient à la première.
    state.i = (state.i + delta + state.view.length) % state.view.length;
    render();
  }

  function mark(known) {
    var c = current();
    if (!c) { return; }
    var avant = estDue(c);
    var f = reviser(c, known);

    /* En mode « à revoir », une carte qui vient d'être réussie ne sera plus due
       avant un moment : elle quitte la file, plutôt que de revenir tout de suite. */
    if (state.reviewMode && avant && !estDue(c)) {
      state.view.splice(state.i, 1);
      if (state.i >= state.view.length) { state.i = 0; }
      updateStats();
      render();
      return;
    }

    updateStats();
    go(1);
    return f;
  }

  function shuffle() {
    for (var i = state.view.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = state.view[i]; state.view[i] = state.view[j]; state.view[j] = tmp;
    }
    state.i = 0;
    render();
  }

  function resetProgress() {
    if (!confirm('Effacer toute la progression (cartes sues et à revoir) ?')) { return; }
    state.progress = {};
    save();
    state.view = state.cards.slice();
    state.i = 0;
    render();
  }

  /* ------------------------------------------------------------------ */
  /*  Geste de glissement                                                */
  /* ------------------------------------------------------------------ */

  /* Glisser vers la droite = « Je sais », vers la gauche = « À revoir » : les
     deux mêmes actions que les boutons, dans le même ordre qu'à l'écran. Un
     appui bref sans déplacement reste un clic, qui retourne la carte. */
  var swipeEl = document.getElementById('swipe');
  var tagYes = swipeEl ? swipeEl.querySelector('.swipe-tag.yes') : null;
  var tagNo = swipeEl ? swipeEl.querySelector('.swipe-tag.no') : null;

  var geste = {
    x0: 0, y0: 0, t0: 0,
    dx: 0,
    pose: false,       // un doigt est posé
    suivi: false,      // le mouvement est horizontal : on suit le doigt
    avaleClic: false   // le clic qui suit la fin d'un glissement est ignoré
  };

  /* Seuil de déclenchement : une fraction de la largeur, bornée, pour rester
     confortable sur un téléphone comme sur un grand écran. */
  function seuilGlissement() {
    var largeur = swipeEl ? swipeEl.offsetWidth : 400;
    return Math.max(70, Math.min(150, largeur * 0.26));
  }

  /* Opacité des étiquettes, proportionnelle à la distance parcourue. */
  function etiquettes(dx) {
    var force = Math.min(Math.abs(dx) / seuilGlissement(), 1);
    if (tagYes) { tagYes.style.opacity = dx > 0 ? force : 0; }
    if (tagNo) { tagNo.style.opacity = dx < 0 ? force : 0; }
  }

  /* Remet l'enveloppe en place sans animation, pour la carte suivante. */
  function remettreEnPlace() {
    if (!swipeEl) { return; }
    swipeEl.classList.remove('dragging');
    swipeEl.style.transition = 'none';
    swipeEl.style.transform = '';
    swipeEl.style.opacity = '';
    void swipeEl.offsetWidth;   // force le navigateur à appliquer tout de suite
    swipeEl.style.transition = '';
  }

  function finDeGlissement(declenche) {
    var dx = geste.dx;
    geste.pose = false;
    geste.suivi = false;
    geste.dx = 0;
    etiquettes(0);

    if (!swipeEl) { return; }

    if (!declenche) {
      // Trop court : la carte revient en place (la transition CSS fait le ressort),
      // et le clic éventuel retournera la carte.
      swipeEl.classList.remove('dragging');
      swipeEl.style.transform = '';
      return;
    }

    // Assez loin : la carte part de son côté, puis on passe à la suivante.
    geste.avaleClic = true;
    window.setTimeout(function () { geste.avaleClic = false; }, 400);
    swipeEl.classList.remove('dragging');
    swipeEl.style.transform = 'translateX(' + (dx > 0 ? 130 : -130) + '%) rotate(' +
      (dx > 0 ? 12 : -12) + 'deg)';
    swipeEl.style.opacity = '0';

    window.setTimeout(function () {
      remettreEnPlace();
      mark(dx > 0);
    }, 230);
  }

  if (swipeEl) {
    swipeEl.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) { return; }
      if (!current()) { return; }
      geste.pose = true;
      geste.suivi = false;
      geste.x0 = e.clientX;
      geste.y0 = e.clientY;
      geste.t0 = Date.now();
      geste.dx = 0;
    });

    swipeEl.addEventListener('pointermove', function (e) {
      if (!geste.pose) { return; }
      var dx = e.clientX - geste.x0;
      var dy = e.clientY - geste.y0;

      if (!geste.suivi) {
        /* Il faut un mouvement franchement horizontal pour prendre la main :
           un geste vertical doit rester un défilement du verso. */
        if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) { return; }
        geste.suivi = true;
        swipeEl.classList.add('dragging');
        try { swipeEl.setPointerCapture(e.pointerId); } catch (err) { /* sans gravité */ }
      }

      if (e.cancelable) { e.preventDefault(); }
      geste.dx = dx;
      // Léger pivot, comme une carte qu'on fait glisser sur la table.
      swipeEl.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 30) + 'deg)';
      etiquettes(dx);
    });

    function relacher() {
      if (!geste.pose) { return; }
      var dx = geste.dx;
      var rapide = (Date.now() - geste.t0) < 250 && Math.abs(dx) > 34;
      var loin = Math.abs(dx) >= seuilGlissement();
      finDeGlissement(geste.suivi && (loin || rapide));
    }

    swipeEl.addEventListener('pointerup', relacher);
    swipeEl.addEventListener('pointercancel', relacher);
    // Filet de sécurité : si la fenêtre perd le focus en plein geste.
    window.addEventListener('blur', function () { if (geste.pose) { finDeGlissement(false); } });
  }

  /* ------------------------------------------------------------------ */
  /*  Menu (burger)                                                      */
  /* ------------------------------------------------------------------ */

  var menuBtn = document.getElementById('menu-toggle');
  var menuPanel = document.getElementById('menu-panel');

  function menuOuvert(ouvert) {
    if (!menuBtn || !menuPanel) { return; }
    menuPanel.hidden = !ouvert;
    menuBtn.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
  }

  if (menuBtn && menuPanel) {
    menuBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      menuOuvert(menuPanel.hidden);
    });
    // Un clic ailleurs referme le menu.
    document.addEventListener('click', function (e) {
      if (!menuPanel.hidden && !menuPanel.contains(e.target)) { menuOuvert(false); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { menuOuvert(false); }
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Mode clair / sombre (阴 / 阳)                                       */
  /* ------------------------------------------------------------------ */

  var THEME_KEY = 'hanzi-theme';
  var themeBtn = document.getElementById('theme-toggle');
  var themeLabel = document.getElementById('theme-label');

  function themeActuel() {
    try { return localStorage.getItem(THEME_KEY) === 'clair' ? 'clair' : 'sombre'; }
    catch (e) { return 'sombre'; }
  }

  function appliquerTheme(nom) {
    var racine = document.documentElement;
    if (nom === 'clair') { racine.setAttribute('data-theme', 'clair'); }
    else { racine.removeAttribute('data-theme'); }

    try { localStorage.setItem(THEME_KEY, nom); } catch (e) { /* on ignore */ }

    if (themeBtn) { themeBtn.setAttribute('aria-checked', nom === 'clair' ? 'true' : 'false'); }
    if (themeLabel) { themeLabel.textContent = nom === 'clair' ? 'Mode clair' : 'Mode sombre'; }

    // La barre système du téléphone suit le thème choisi.
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) { meta.setAttribute('content', nom === 'clair' ? '#f3ecda' : '#0e1114'); }
  }

  if (themeBtn) {
    appliquerTheme(themeActuel());   // le script du <head> l'a déjà posé : on synchronise l'interrupteur
    themeBtn.addEventListener('click', function () {
      appliquerTheme(themeActuel() === 'clair' ? 'sombre' : 'clair');
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Sauvegarde de la progression                                       */
  /* ------------------------------------------------------------------ */

  /* La progression ne vit que dans ce navigateur. L'export produit un fichier
     JSON lisible, l'import le relit : utile pour changer de téléphone, ou
     avant de vider les données du site. */
  function exporterProgression() {
    var paquet = {
      app: 'hanzi-cards',
      version: 2,
      exporteLe: aujourdhui(),
      fiches: state.cards.length,
      progression: state.progress
    };
    var blob = new Blob([JSON.stringify(paquet, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'cartes-progression-' + aujourdhui() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  /* Accepte un export complet (objet avec « progression ») ou une simple table
     de progression : un fichier bricolé à la main reste utilisable. */
  function progressionDe(paquet) {
    if (!paquet || typeof paquet !== 'object' || Array.isArray(paquet)) { return null; }
    var prog = paquet.progression || paquet;
    if (!prog || typeof prog !== 'object' || Array.isArray(prog)) { return null; }
    var res = {};
    var n = 0;
    Object.keys(prog).forEach(function (k) {
      if (prog[k] && typeof prog[k] === 'object') { res[k] = prog[k]; n++; }
    });
    return n ? res : null;
  }

  function restaurerProgression(fichier) {
    var lecteur = new FileReader();
    lecteur.onload = function () {
      var paquet = null;
      try { paquet = JSON.parse(lecteur.result); } catch (e) { paquet = null; }
      var prog = progressionDe(paquet);
      if (!prog) {
        alert('Ce fichier ne contient pas de progression lisible.');
        return;
      }
      var n = Object.keys(prog).length;
      if (!confirm('Remplacer ta progression actuelle par celle de ce fichier (' + n + ' fiches) ?')) { return; }
      state.progress = prog;
      migrerProgression();   // au cas où la sauvegarde vient d'une ancienne version
      save();
      render();
      updateStats();
      alert('Progression restaurée : ' + n + ' fiches.');
    };
    lecteur.readAsText(fichier);
  }

  var btnExport = document.getElementById('export');
  var btnImport = document.getElementById('import');
  var champImport = document.getElementById('import-file');

  if (btnExport) {
    btnExport.addEventListener('click', function () {
      menuOuvert(false);
      exporterProgression();
    });
  }
  if (btnImport && champImport) {
    btnImport.addEventListener('click', function () {
      menuOuvert(false);
      champImport.click();
    });
    champImport.addEventListener('change', function () {
      if (champImport.files && champImport.files[0]) { restaurerProgression(champImport.files[0]); }
      champImport.value = '';   // pour pouvoir rechoisir le même fichier
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Ordre des traits (hanzi-writer)                                    */
  /* ------------------------------------------------------------------ */

  /* Tout arrive à la demande : la bibliothèque (36 Ko) et les tracés (494 Ko)
     ne sont téléchargés que si on demande l'animation. La version « un seul
     fichier » ne les embarque pas — d'où monoFichier. */
  var monoFichier = !!window.__CARDS__;
  var biblioPrete = false;
  var traces = null;
  var writer = null;
  var carteDessinee = '';   // le caractère actuellement dessiné dans le carré

  function chargerBibliotheque(fait, rate) {
    if (biblioPrete) { fait(); return; }
    var s = document.createElement('script');
    s.src = 'assets/hanzi-writer.min.js';
    s.onload = function () { biblioPrete = true; fait(); };
    s.onerror = rate;
    document.head.appendChild(s);
  }

  function chargerTraces(fait, rate) {
    if (traces) { fait(); return; }
    fetch('data/strokes.json')
      .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
      .then(function (d) { traces = d; fait(); })
      .catch(rate);
  }

  function couleurCSS(nom, secours) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(nom);
    return (v && v.trim()) || secours;
  }

  /* Le clic vient-il du carré 田字格 ?

     On interroge le CHEMIN de l'événement, pas les ancêtres actuels de la cible :
     au premier appui le contenu du carré est réécrit, donc la cible peut avoir
     été retirée du document entre-temps — et un élément détaché n'a plus
     d'ancêtres, si bien que target.closest('.traits') renverrait null et le clic
     remonterait retourner la carte. Le chemin, lui, est figé à l'émission. */
  function dansLesTraits(e) {
    if (e.composedPath) {
      var chemin = e.composedPath();
      for (var i = 0; i < chemin.length; i++) {
        var n = chemin[i];
        if (n && n.classList && n.classList.contains('traits')) { return true; }
      }
      return false;
    }
    return !!(e.target && e.target.closest && e.target.closest('.traits'));
  }

  /* Prépare le dessin de la carte affichée, puis joue l'animation. Un appui
     suivant relance l'animation déjà en place, sans tout reconstruire. */
  function animerTraits() {
    var boite = document.getElementById('traits-box');
    var c = current();
    if (!boite || !c) { return; }

    function message(texte) {
      // On remplace le texte du noeud existant : pas de noeud retiré en plein clic.
      var note = boite.querySelector('.traits-note');
      if (note) { note.textContent = texte; }
      else { boite.innerHTML = '<p class="traits-note">' + texte + '</p>'; }
    }

    function jouer() {
      var donnees = traces ? traces[c.char] : null;
      if (!donnees) {
        message('Pas de tracé pour ce caractère.');
        return;
      }
      if (writer && carteDessinee === c.char) { writer.animateCharacter(); return; }
      boite.innerHTML = '';
      writer = HanziWriter.create(boite, c.char, {
        width: 198, height: 198, padding: 8,
        showOutline: false,
        /* showCharacter vaut true par défaut : le caractère serait peint entier
           à la création, puis l'animation le remettrait à zéro pour le
           redessiner — d'où un clignotement au premier appui. */
        showCharacter: false,
        strokeColor: couleurCSS('--accent', '#d8b26a'),
        drawingColor: couleurCSS('--txt', '#ffffff'),
        highlightColor: couleurCSS('--ok', '#3ecf8e'),
        strokeAnimationSpeed: 1,
        delayBetweenStrokes: 200,
        charDataLoader: function (car, onComplete) { onComplete(donnees); }
      });
      carteDessinee = c.char;
      writer.animateCharacter();
    }

    function echec() {
      message('Tracés indisponibles : cette animation demande la version servie par un serveur.');
    }

    if (!biblioPrete || !traces) { message('⏳'); }
    chargerBibliotheque(function () { chargerTraces(jouer, echec); }, echec);
  }

  /* Un seul écouteur, posé sur le verso : son contenu est réécrit à chaque
     carte, mais l'élément qui le contient ne change pas. Un appui dans le carré
     田字格 — et nulle part ailleurs — lance l'animation, et on arrête là la
     remontée du clic : le gestionnaire de la carte n'a rien à y faire. */
  if (!monoFichier) {
    el.back.addEventListener('click', function (e) {
      if (!dansLesTraits(e)) { return; }
      e.stopPropagation();
      animerTraits();
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Écouteurs                                                          */
  /* ------------------------------------------------------------------ */

  el.card.addEventListener('click', function (e) {
    /* Un glissement se termine parfois par un clic : on l'ignore, sinon la
       carte se retournerait juste après avoir été jugée. */
    if (geste.avaleClic) { return; }
    /* Le carré 田字格 est DANS la carte : sans ce filtre, l'appui qui lance
       l'animation remonterait jusqu'ici et retournerait la carte. */
    if (dansLesTraits(e)) { return; }
    flip();
  });
  el.card.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); flip(); }
  });

  /* Tout ce qui commande est désormais dans le menu : l'écran ne garde que la
     carte. Un appui sur la carte la retourne, un glissement la juge. Chaque
     entrée du menu referme celui-ci avant d'agir — sinon on ne verrait pas le
     résultat. Au clavier, ← → naviguent et 1 / 2 jugent, sans rien afficher. */
  function depuisLeMenu(id, action) {
    document.getElementById(id).addEventListener('click', function () {
      menuOuvert(false);
      action();
    });
  }

  depuisLeMenu('known', function () { mark(true); });
  depuisLeMenu('again', function () { mark(false); });
  depuisLeMenu('shuffle', shuffle);
  depuisLeMenu('reset', resetProgress);

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') { return; }
    switch (e.key) {
      case ' ': case 'Enter': e.preventDefault(); flip(); break;
      case 'ArrowLeft': go(-1); break;
      case 'ArrowRight': go(1); break;
      case '1': mark(false); break;
      case '2': mark(true); break;
    }
  });

  /* ------------------------------------------------------------------ */
  /*  Démarrage                                                          */
  /* ------------------------------------------------------------------ */

  /* L'adresse peut préciser ce qu'on révise : la page theme.html envoie
     index.html?theme=Nature ou index.html?review=1, et l'application ne
     garde que ces cartes. C'est ce qui remplace les filtres — sans rien
     ajouter à l'écran. */
  function parametres() {
    var p = {};
    window.location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) { return; }
      var i = kv.indexOf('=');
      var cle = i === -1 ? kv : kv.slice(0, i);
      var val = i === -1 ? '' : kv.slice(i + 1);
      try { p[decodeURIComponent(cle)] = decodeURIComponent(val); } catch (e) { /* on ignore */ }
    });
    return p;
  }

  function start(data) {
    state.cards = data.cards || [];
    var p = parametres();
    state.reviewMode = (p.review === '1');
    state.titre = p.theme || (state.reviewMode ? 'À revoir aujourd\'hui' : '');

    if (p.theme) {
      state.view = state.cards.filter(function (c) { return c.category === p.theme; });
    } else if (state.reviewMode) {
      state.view = state.cards.filter(estDue);
    } else {
      state.view = state.cards.slice();
    }

    /* ?char=好 : la recherche de la page Thèmes renvoie ici sur un caractère
       précis. On garde tout le paquet et on se place simplement dessus, pour
       pouvoir continuer la révision à partir de là. */
    if (p.char) {
      for (var k = 0; k < state.view.length; k++) {
        if (state.view[k].char === p.char) { state.i = k; break; }
      }
    }

    el.deckName.textContent = (state.titre || data.deck || 'Jeu de cartes') +
      ' — ' + state.view.length + ' caractères';
    render();
  }

  function fail(err) {
    el.deckName.textContent = 'Erreur';
    el.back.innerHTML = '<p class="meaning">Impossible de charger les cartes : ' + esc(err.message) +
      '<br><br>Lance le site via un serveur local (serve.cmd ou Ctrl+Shift+B dans VS Code) : ' +
      'un fichier ouvert en file:// ne peut pas lire le JSON voisin.</p>';
  }

  load();

  /* Deux modes de chargement :
     - fichier unique (cartes-mobile.html) : les données sont déjà dans la page,
       via window.__CARDS__ — aucun réseau nécessaire, ça marche hors ligne ;
     - site normal : on va chercher data/cards.json. */
  if (window.__CARDS__) {
    start(window.__CARDS__);
  } else {
    fetch('data/cards.json', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('fichier de cartes introuvable (' + r.status + ')'); }
        return r.json();
      })
      .then(start)
      .catch(fail);
  }

  /* Installation sur le téléphone : le service worker met le site en cache pour
     qu'il fonctionne hors ligne. Il n'est disponible que sur une origine
     sécurisée (https, ou localhost) — sur http:// vers l'IP du réseau local le
     navigateur le refuse, et `serviceWorker` est simplement absent. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () { /* silencieux */ });
    });
  }

})();

</script>
</body>
</html>
