<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes — 汉字</title>
<meta name="description" content="Cartes de révision français / chinois : caractère au recto, pinyin, radicaux, exemples et étymologie au verso.">
<link rel="stylesheet" href="assets/style.css?v=210">

<!-- Applique le thème choisi AVANT le premier affichage : sans ça, on verrait
     un flash clair au chargement quand on a choisi le mode sombre. -->
<script>
(function () {
  try {
    if (localStorage.getItem('hanzi-theme') === 'clair') {
      document.documentElement.setAttribute('data-theme', 'clair');
    }
  } catch (e) { /* navigation privée : on garde le thème par défaut */ }
})();
</script>

<!-- Installation sur téléphone : manifeste, icônes, couleur de la barre système -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1114">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cartes 汉字">
</head>
<body>



<main class="wrap">
  <div class="stage">
    <!-- L'enveloppe « swipe » porte le glissement ; la carte garde son
         retournement 3D, les deux transformations ne se marchent pas dessus. -->
    <div class="swipe" id="swipe">
      <div class="swipe-tag yes" aria-hidden="true">Je sais</div>
      <div class="swipe-tag no" aria-hidden="true">À revoir</div>
      <article class="card" id="card" tabindex="0" aria-label="Carte de révision">
        <!-- Recto : le caractère, seul, en grand -->
        <div class="face front">
          <div class="glyph" id="front-glyph">汉</div>
          <p class="hint">Clic ou <kbd>Espace</kbd> pour retourner<span class="touch-only"> · glisse ← → pour juger</span></p>
        </div>
        <!-- Verso : rempli par app.js -->
        <div class="face back" id="back"></div>
      </article>
    </div>
  </div>
</main>

  <!-- La barre du bas : les informations de la carte, la progression, puis les
       onglets. Chaque onglet ouvre une feuille posée juste au-dessus. -->


<!-- L'accueil n'est pas une feuille : c'est une page, posée dans le corps du
     document, au-dessus de la carte. Seul Accueil fait ça ; Parcourir, Niveau
     et Réglages restent des feuilles du pied de page. -->
<div class="page" id="accueil" hidden>
  <p class="accueil-marque">满脑汉字</p>

  <!-- Les quatre niveaux, comme sur la page Thèmes, mais ici : au-dessus du
       champ de recherche. Les liens restent relatifs et pointent sur
       l'application (elle comprend ?niveau=). -->
  <nav class="niveaux accueil-niveaux" aria-label="Niveau">
    <button type="button" data-niveau="hsk1">HSK 1</button>
    <button type="button" data-niveau="hsk2">HSK 2</button>
    <button type="button" data-niveau="hsk3">HSK 3</button>
    <button type="button" data-niveau="tout">Tous les niveaux</button>
  </nav>

  <div class="accueil-champ">
  <label class="accueil-label" for="accueil-recherche">Recherche</label>
  <input type="search" id="accueil-recherche" class="recherche" placeholder="Caractère, pinyin ou sens…"
         autocomplete="off" spellcheck="false" aria-label="Rechercher une fiche">
  <div id="accueil-resultats" class="feuille-resultats"></div>
  </div>

  <!-- « Où j'en suis » : le résumé du jour et la prévision des sept prochains
       jours, sur les trois niveaux réunis. -->
  <section class="bloc">
    <h2 class="bloc-titre">Où j'en suis</h2>
    <p class="resume" id="accueil-resume">chargement…</p>
    <div class="prevision" id="accueil-prevision"></div>
  </section>

  <!-- « Réviser par thème » : les thèmes de vocabulaire des trois niveaux, avec
       leur compte et un lien qui charge le paquet correspondant. -->
  <button class="bouton-reviser" id="accueil-reviser" type="button">Réviser</button>

  <section class="bloc">
    <h2 class="bloc-titre">Réviser par thème</h2>
    <nav class="themes" id="accueil-themes" aria-label="Thèmes de vocabulaire"></nav>
  </section>
</div>


<!-- La page des cartes à revoir : une liste de liens vers les fiches dues. -->
<div class="page" id="revoir" hidden>
  <p class="accueil-titre">Cartes à revoir</p>
  <div id="revoir-liste" class="feuille-resultats"></div>
</div>

  <!-- La page « Réviser » : une grille de mini-cartes, filtrée par les trois
     boutons du haut. Le titre suit le filtre. -->
<div class="page" id="liste" hidden>
  <button class="liste-retour" id="liste-retour" type="button">← Accueil</button>
  <h2 class="liste-titre" id="liste-titre">Révision</h2>
  <div class="filtres" id="liste-filtres">
    <button type="button" data-filtre="revoir" class="actif">À revoir</button>
    <button type="button" data-filtre="favoris">Favoris</button>
    <button type="button" data-filtre="sais">Je sais</button>
  </div>
  <div class="mini-grille" id="liste-grille"></div>
</div>

<footer class="bas">
    <div class="bar" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100"><span id="bar-fill"></span></div>

    <nav class="onglets" aria-label="Sections">
      <button class="onglet" type="button" data-onglet="reviser" aria-expanded="false" aria-label="Réviser" title="Réviser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 0 0-13.7-5.6L4 7.5"/><path d="M4 4v3.5h3.5"/>
          <path d="M4 13a8 8 0 0 0 13.7 5.6L20 16.5"/><path d="M20 20v-3.5h-3.5"/>
        </svg>
        <span class="onglet-badge" id="badge" hidden></span>
      </button>
      <button class="onglet" type="button" data-onglet="accueil" aria-expanded="false" aria-label="Accueil" title="Accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 4.5l8 7"/><path d="M6 10.5V20h12v-9.5"/><path d="M10.5 20v-5h3v5"/></svg>
      </button>
      <button class="onglet" type="button" data-onglet="reglages" aria-expanded="false" aria-label="Réglages" title="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8h16"/><circle cx="10" cy="8" r="2.3"/>
          <path d="M4 16h16"/><circle cx="15" cy="16" r="2.3"/>
        </svg>
      </button>
    </nav>

    <!-- Ce que chaque onglet ouvre -->
    <div class="feuille" data-feuille="reviser" hidden>
      <p class="feuille-titre">Cette carte</p>
      <p class="feuille-info" id="aujourdhui"></p>
      <p class="feuille-jour"><span>À revoir</span><b id="statut-revoir">0</b></p>
      <p class="feuille-jour"><span>Je sais</span><b id="statut-sais">0</b></p>
      <p class="feuille-jour"><span>Favoris</span><b id="statut-favoris">0</b></p>
    </div>



    <div class="feuille" data-feuille="reglages" hidden>
      <p class="feuille-titre">Apparence</p>
      <button id="theme-toggle" class="switch" type="button" role="switch" aria-checked="false">
        <span class="sw-yin" aria-hidden="true">阴</span>
        <span class="sw-track" aria-hidden="true"><span class="sw-knob"></span></span>
        <span class="sw-yang" aria-hidden="true">阳</span>
        <span class="sw-label" id="theme-label">Mode sombre</span>
      </button>

      <p class="feuille-titre">Recherche</p>
      <button id="recherche-contenu" class="switch" type="button" role="switch" aria-checked="false">
        <span class="sw-yin" aria-hidden="true">字</span>
        <span class="sw-track" aria-hidden="true"><span class="sw-knob"></span></span>
        <span class="sw-yang" aria-hidden="true">卡</span>
        <span class="sw-label" id="recherche-label">Recherche : pinyin</span>
      </button>

      <p class="feuille-titre">Progression</p>
      <button id="export" class="feuille-entree" type="button">Sauvegarder</button>
      <button id="import" class="feuille-entree" type="button">Restaurer</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button id="reset" class="feuille-entree" type="button">Réinitialiser</button>
      <p class="feuille-info" id="sauvegarde"></p>
    </div>
    <p class="version">Version <span id="version">?</span> — <span id="version-niveaux">HSK 1 / HSK 2 / HSK 3</span></p>
  </footer>

<script src="assets/app.js?v=210"></script>
</body>
</html>
