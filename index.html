<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes — 汉字</title>
<meta name="description" content="Cartes de révision français / chinois : caractère au recto, pinyin, radicaux, exemples et étymologie au verso.">
<link rel="stylesheet" href="assets/style.css">

<!-- Applique le thème choisi AVANT le premier affichage : sans ça, on verrait
     un flash clair au chargement quand on a choisi le mode sombre. -->
<script>
(function () {
  try {
    if (localStorage.getItem('hanzi-theme') === 'clair') {
      document.documentElement.setAttribute('data-theme', 'clair');
    }
  } catch (e) { /* navigation privée : on garde le thème par défaut */ }
})();
</script>

<!-- Installation sur téléphone : manifeste, icônes, couleur de la barre système -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1114">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cartes 汉字">
</head>
<body>



<main class="wrap">
  <div class="stage">
    <!-- L'enveloppe « swipe » porte le glissement ; la carte garde son
         retournement 3D, les deux transformations ne se marchent pas dessus. -->
    <div class="swipe" id="swipe">
      <div class="swipe-tag yes" aria-hidden="true">Je sais</div>
      <div class="swipe-tag no" aria-hidden="true">À revoir</div>
      <article class="card" id="card" tabindex="0" aria-label="Carte de révision">
        <!-- Recto : le caractère, seul, en grand -->
        <div class="face front">
          <div class="glyph" id="front-glyph">汉</div>
          <p class="hint">Clic ou <kbd>Espace</kbd> pour retourner<span class="touch-only"> · glisse ← → pour juger</span></p>
        </div>
        <!-- Verso : rempli par app.js -->
        <div class="face back" id="back"></div>
      </article>
    </div>
  </div>
</main>

<footer class="wrap foot">
  <div class="top-inner">

    <div class="brand">
      <span class="logo">汉</span>
      <div>
        <h1>Cartes</h1>
        <p class="sub" id="deck-name">chargement…</p>
      </div>
    </div>
    <div class="stats">
      <div class="bar" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100"><span id="bar-fill"></span></div>
      <p id="counters" class="counters">…</p>
    </div>
    <nav class="menu">
      <button id="menu-toggle" class="menu-btn" type="button"
              aria-expanded="false" aria-controls="menu-panel" aria-label="Menu">
        <span class="burger" aria-hidden="true"></span>
      </button>
      <div class="menu-panel" id="menu-panel" hidden>
        <!-- Les deux jugements portent sur la carte affichée -->
        <p class="menu-titre">Cette carte</p>
        <button id="again" class="menu-item warn" type="button">À revoir <kbd>1</kbd></button>
        <button id="known" class="menu-item ok" type="button">Je sais <kbd>2</kbd></button>

        <p class="menu-titre">Parcourir</p>
        <a href="theme.html">Thèmes de vocabulaire</a>
        <a href="index.html?review=1">Cartes à revoir</a>
        <a href="index.html">Toutes les cartes</a>
        <button id="shuffle" class="menu-item" type="button">Mélanger</button>

        <p class="menu-titre">Progression</p>
        <button id="reset" class="menu-item" type="button">Réinitialiser</button>
        <button id="export" class="menu-item" type="button">Sauvegarder</button>
        <button id="import" class="menu-item" type="button">Restaurer</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>

        <p class="menu-titre">Apparence</p>
        <!-- 阴 l'ombre, 阳 la lumière : le curseur indique le mode en cours -->
        <button id="theme-toggle" class="switch" type="button" role="switch" aria-checked="false">
          <span class="sw-yin" aria-hidden="true">阴</span>
          <span class="sw-track" aria-hidden="true"><span class="sw-knob"></span></span>
          <span class="sw-yang" aria-hidden="true">阳</span>
          <span class="sw-label" id="theme-label">Mode sombre</span>
        </button>
      </div>
    </nav>
    <span id="position" class="pos"></span>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
